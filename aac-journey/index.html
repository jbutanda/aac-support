<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AAC Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* IDEA a road trip map: eight stops from "someone notices" to "growing", a little car drives to each one
   LAYOUT scenic road (desktop) or vertical trail (phone), then a stop card with four plain-language boxes */
:root{--band:#364fc7;--maxw:1040px;--decol:72%}
.scene{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(#dbe4ff,#edf2ff 60%,#d3f9d8 60%);margin-bottom:18px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .scene{background:linear-gradient(#1c2350,#232b5c 60%,#183a22 60%)}}
.scene svg{display:block;width:100%;height:auto}
.stop{cursor:pointer}
.stop circle.dot{fill:#fff;stroke:#364fc7;stroke-width:5;transition:r .25s}
.stop text{font:700 22px "Atkinson Hyperlegible",system-ui,sans-serif;fill:#364fc7;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.stop.on circle.dot{fill:#364fc7}
.stop.on text:not(.lab){fill:#fff}
.stop.done circle.dot{fill:#bac8ff}
.stop:focus{outline:none}.stop:focus-visible circle.dot{stroke:#f59f00;stroke-width:7}
.stop .lab{font-size:15px;fill:#1d2026;font-weight:700}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stop .lab{fill:#eceef2}}
.trail{display:none;list-style:none;margin:0 0 18px;padding:0;position:relative}
.trail::before{content:'';position:absolute;left:25px;top:20px;bottom:20px;width:6px;border-radius:4px;background:repeating-linear-gradient(#bac8ff 0 12px,transparent 12px 20px)}
.trail button{position:relative;display:flex;gap:12px;align-items:center;width:100%;font:inherit;font-weight:700;text-align:left;border:0;background:none;color:var(--ink);padding:6px 0;min-height:56px;cursor:pointer}
.trail .n{width:56px;height:56px;border-radius:50%;background:var(--card);border:5px solid #364fc7;display:grid;place-items:center;color:#364fc7;font-size:20px;flex:none}
.trail button[aria-current=step] .n{background:#364fc7;color:#fff}
@media(max-width:720px){.scene{display:none}.trail{display:block}}
.panel{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.badge{background:linear-gradient(160deg,#4c6ef5,#364fc7);color:#fff;border-radius:24px;padding:18px;text-align:center}
.badge img{width:96px;background:#fff;border-radius:22px;padding:10px}
.badge .kk{font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin:10px 0 2px}
.badge h2{color:#fff;margin:0;font-size:24px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border-radius:18px;padding:14px 16px;background:var(--tint)}
.box h3{margin:0 0 4px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.box h3 img{width:26px}
.box p{margin:0}
.box.ask{background:light-dark(#fff4e6,#33230c)}
.box.know{background:light-dark(#e6fcf5,#0f2e25)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.legal{font-size:14px;color:var(--soft);margin:14px 0 0}
@media(max-width:720px){.panel{grid-template-columns:1fr}.boxes{grid-template-columns:1fr}.badge{display:flex;gap:14px;align-items:center;text-align:left}.badge img{width:64px}}
</style>
</head>
<body>
<header class="band"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button></div></div>
</div></header>
<main class="wrap">
  <section class="card">
    <div class="scene" id="scene"></div>
    <ol class="trail" id="trail"></ol>
    <div id="panel"></div>
    <p class="legal" id="legal"></p>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script>
const {esc,sym}=AAC,$=id=>document.getElementById(id);
let L=AAC.pageLang(),cur=0;
const T={en:{h1:'The AAC Journey',sub:'What happens from the first concern to everyday talking, and what you can ask for along the way.',stop:'Stop',what:'What happens',who:'Who is there',ask:'You can ask',know:'Good to know',prev:'← Back',next:'Next stop →',start:'Start over',legal:'This is a general guide based on California and federal special education rules. Your child’s case manager can tell you where you are on the road.',foot:'Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
es:{h1:'El camino de la CAA',sub:'Lo que pasa desde la primera inquietud hasta la comunicación diaria, y lo que puede pedir en el camino.',stop:'Parada',what:'Qué pasa',who:'Quién participa',ask:'Usted puede preguntar',know:'Es bueno saber',prev:'← Atrás',next:'Siguiente parada →',start:'Empezar de nuevo',legal:'Esta es una guía general basada en las reglas de educación especial de California y federales. El encargado del caso de su hijo puede decirle en qué parte del camino están.',foot:'Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const S=[
{ic:'eyes',en:{t:'Someone notices',w:'A parent, teacher or SLP notices the student has more to say than speech allows right now.',o:'Family, teacher, SLP',a:'“Could AAC help my child?” You can ask for an evaluation in writing at any time.',k:'There is nothing a child has to do first to get AAC. No age, skill or test score is required.'},
 es:{t:'Alguien se da cuenta',w:'Un padre, maestro o terapeuta nota que el estudiante tiene más que decir de lo que el habla le permite ahora.',o:'Familia, maestro, terapeuta del habla',a:'“¿La CAA podría ayudar a mi hijo?” Puede pedir una evaluación por escrito en cualquier momento.',k:'El niño no tiene que hacer nada antes para recibir CAA. No se requiere edad, habilidad ni puntaje.'}},
{ic:'memo',en:{t:'Assessment plan',w:'The school sends a written plan that lists what will be evaluated. You sign it to give consent.',o:'Case manager, family',a:'“Will AAC and assistive technology be part of the evaluation?”',k:'In California, the school has 15 days to send the plan after a written request, not counting school breaks longer than 5 school days. You get at least 15 days to review it.'},
 es:{t:'Plan de evaluación',w:'La escuela envía un plan por escrito con lo que se va a evaluar. Usted lo firma para dar su permiso.',o:'Encargado del caso, familia',a:'“¿La CAA y la tecnología de asistencia serán parte de la evaluación?”',k:'En California, la escuela tiene 15 días para enviar el plan después de una solicitud por escrito, sin contar vacaciones de más de 5 días escolares. Usted tiene al menos 15 días para revisarlo.'}},
{ic:'search',en:{t:'AAC evaluation',w:'The AAC specialist gets to know the student: how they communicate now, what they love, how they move, see and understand.',o:'AAC specialist, SLP, often OT, teacher, family',a:'“Can I share videos of how my child communicates at home?”',k:'You know your child best, so your input matters. If you disagree with the school’s evaluation, you can ask for an Independent Educational Evaluation (IEE).'},
 es:{t:'Evaluación de CAA',w:'El especialista en CAA conoce al estudiante: cómo se comunica ahora, qué le gusta, cómo se mueve, ve y entiende.',o:'Especialista en CAA, terapeuta del habla, a veces terapeuta ocupacional, maestro, familia',a:'“¿Puedo compartir videos de cómo se comunica mi hijo en casa?”',k:'Usted conoce mejor a su hijo, así que su opinión importa. Si no está de acuerdo con la evaluación, puede pedir una Evaluación Educativa Independiente (IEE).'}},
{ic:'test',en:{t:'Trying it out',w:'The student tries one or more AAC systems during real activities, so the team can see what works in real life.',o:'AAC specialist, SLP, classroom staff',a:'“Which systems are being tried, and why?”',k:'Trials show more than a short test can. Students often surprise everyone once they have words to use.'},
 es:{t:'Probándolo',w:'El estudiante prueba uno o más sistemas de CAA en actividades reales, para que el equipo vea qué funciona en la vida diaria.',o:'Especialista en CAA, terapeuta del habla, personal del salón',a:'“¿Qué sistemas están probando y por qué?”',k:'Las pruebas muestran más que un examen corto. Los estudiantes muchas veces sorprenden cuando tienen palabras para usar.'}},
{ic:'handshake',en:{t:'IEP meeting',w:'The team reviews the results and writes AAC into the IEP: the system, supports, goals and training for staff and family.',o:'The whole IEP team, including you',a:'“Will the device come home?” and “Who will train staff and our family?”',k:'In California, the IEP meeting happens within 60 days of your consent. If the team decides the student needs the device at home, the school provides it for home use too.'},
 es:{t:'Reunión del IEP',w:'El equipo revisa los resultados y escribe la CAA en el IEP: el sistema, los apoyos, las metas y la capacitación para el personal y la familia.',o:'Todo el equipo del IEP, incluyéndolo a usted',a:'“¿El dispositivo vendrá a casa?” y “¿Quién capacitará al personal y a la familia?”',k:'En California, la reunión del IEP se hace dentro de 60 días después de su permiso. Si el equipo decide que el estudiante necesita el dispositivo en casa, la escuela lo proporciona para usarlo en casa también.'}},
{ic:'gear',en:{t:'Setup and training',w:'The device is set up for the student. Staff and family learn how to model, which means using the device while you talk.',o:'AAC specialist, SLP, teachers, paras, family',a:'“Can we get training on how to model at home?”',k:'Students learn AAC by seeing others use it. Training the adults matters as much as the device.'},
 es:{t:'Preparación y capacitación',w:'Se prepara el dispositivo para el estudiante. El personal y la familia aprenden a modelar, es decir, usar el dispositivo mientras hablan.',o:'Especialista en CAA, terapeuta del habla, maestros, asistentes, familia',a:'“¿Nos pueden capacitar para modelar en casa?”',k:'Los estudiantes aprenden CAA viendo a otros usarla. Capacitar a los adultos importa tanto como el dispositivo.'}},
{ic:'speech',en:{t:'Everyday talking',w:'The device goes everywhere: class, lunch, recess, the bus, home. Adults model, wait and respond to everything the student says.',o:'Everyone in the student’s day',a:'“What words are we working on this month?”',k:'Learning AAC is like learning a new language. It takes time and lots of chances to see it used.'},
 es:{t:'Comunicación diaria',w:'El dispositivo va a todas partes: clase, almuerzo, recreo, autobús, casa. Los adultos modelan, esperan y responden a todo lo que dice el estudiante.',o:'Todas las personas en el día del estudiante',a:'“¿Qué palabras estamos practicando este mes?”',k:'Aprender CAA es como aprender un idioma nuevo. Toma tiempo y muchas oportunidades de verla en uso.'}},
{ic:'seedling',en:{t:'Growing',w:'The team checks progress, adds words and makes changes as the student grows. Needs change, and the system can change too.',o:'The IEP team',a:'“What comes next for my child’s communication?”',k:'You can ask for an IEP meeting any time you have questions or concerns. You don’t have to wait for the annual meeting.'},
 es:{t:'Creciendo',w:'El equipo revisa el progreso, agrega palabras y hace cambios a medida que el estudiante crece. Las necesidades cambian y el sistema también.',o:'El equipo del IEP',a:'“¿Qué sigue para la comunicación de mi hijo?”',k:'Puede pedir una reunión del IEP cuando tenga preguntas o inquietudes. No tiene que esperar a la reunión anual.'}}];
const t=k=>T[L][k];
const X=[70,190,330,470,560,690,830,940],Y=[250,150,230,120,250,170,250,120];
const road='M10,270 C60,270 60,250 70,250 S150,150 190,150 S290,230 330,230 S440,120 470,120 S530,250 560,250 S650,170 690,170 S780,250 830,250 S920,120 940,120 L990,100';
function scene(){
 $('scene').innerHTML=`<svg viewBox="0 0 1000 330" role="group" aria-label="${t('h1')}">
 <path d="M0,215 C140,160 260,205 380,180 S640,150 760,185 S930,165 1000,150 L1000,330 L0,330Z" fill="#b2f2bb" opacity=".8"/>
 <path d="M0,260 C180,230 320,275 520,255 S820,240 1000,230 L1000,330 L0,330Z" fill="#8ce99a" opacity=".7"/>
 <g opacity=".85"><circle cx="880" cy="48" r="26" fill="#ffd43b"/><ellipse cx="160" cy="50" rx="46" ry="15" fill="#fff"/><ellipse cx="190" cy="40" rx="30" ry="14" fill="#fff"/><ellipse cx="600" cy="62" rx="40" ry="13" fill="#fff"/></g>
 <path d="${road}" fill="none" stroke="#868e96" stroke-width="34" stroke-linecap="round"/>
 <path d="${road}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="14 14"/>
 <path id="rp" d="${road}" fill="none" stroke="none"/>
 ${S.map((s,i)=>`<g class="stop ${i===cur?'on':i<cur?'done':''}" data-s="${i}" tabindex="0" role="button" aria-label="${t('stop')} ${i+1}: ${esc(s[L].t)}">
   <circle class="dot" cx="${X[i]}" cy="${Y[i]}" r="${i===cur?26:21}"/><text x="${X[i]}" y="${Y[i]}">${i+1}</text>
   <text class="lab" x="${X[i]}" y="${Y[i]+(Y[i]>200?46:-40)}">${esc(s[L].t)}</text></g>`).join('')}
 <image id="car" href="${sym("car")}" width="74" height="74" x="-37" y="-60"/>
 </svg>`;
 placeCar(false);
}
let carAt=null;
function ptFor(i){const p=$('rp'),n=p.getTotalLength();let best=0,bd=1e9;for(let l=0;l<=n;l+=4){const q=p.getPointAtLength(l),d=(q.x-X[i])**2+(q.y-Y[i])**2;if(d<bd){bd=d;best=l}}return best}
function placeCar(anim){const car=$('car');if(!car)return;const p=$('rp'),to=Math.max(0,ptFor(cur)-48),from=carAt==null?to:carAt;carAt=to;
 const set=l=>{const q=p.getPointAtLength(l),q2=p.getPointAtLength(Math.min(l+2,p.getTotalLength()));const flip=q2.x<q.x;car.setAttribute('transform',`translate(${q.x},${q.y}) ${flip?'scale(-1,1)':''}`)};
 if(!anim||AAC.reduced()){set(to);return}const t0=performance.now(),d=700;const step=n=>{const k=Math.min(1,(n-t0)/d),e=k<.5?2*k*k:1-(-2*k+2)**2/2;set(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function trail(){$('trail').innerHTML=S.map((s,i)=>`<li><button data-s="${i}" ${i===cur?'aria-current="step"':''}><span class="n">${i+1}</span>${esc(s[L].t)}</button></li>`).join('')}
function panel(){const s=S[cur][L];
 $('panel').innerHTML=`<div class="panel" aria-live="polite"><div class="badge"><img src="${sym(S[cur].ic)}" alt=""><div><p class="kk">${t('stop')} ${cur+1} / ${S.length}</p><h2>${esc(s.t)}</h2></div></div>
 <div><div class="boxes"><div class="box"><h3><img src="${sym('book')}" alt="">${t('what')}</h3><p>${esc(s.w)}</p></div><div class="box"><h3><img src="${sym('family')}" alt="">${t('who')}</h3><p>${esc(s.o)}</p></div>
 <div class="box ask"><h3><img src="${sym('question')}" alt="">${t('ask')}</h3><p>${esc(s.a)}</p></div><div class="box know"><h3><img src="${sym('bulb')}" alt="">${t('know')}</h3><p>${esc(s.k)}</p></div></div>
 <div class="nav"><button class="btn ghost" data-go="-1" ${cur?'':'disabled'}>${t('prev')}</button>${cur<S.length-1?`<button class="btn" style="background:#364fc7;color:#fff" data-go="1">${t('next')}</button>`:`<button class="btn go" data-go="0">${t('start')}</button>`}</div></div></div>`}
function go(i,anim=true){cur=i;document.querySelectorAll('.stop').forEach(g=>{const k=+g.dataset.s;g.classList.toggle('on',k===cur);g.classList.toggle('done',k<cur);g.querySelector('.dot').setAttribute('r',k===cur?26:21)});trail();panel();placeCar(anim)}
document.addEventListener('click',e=>{const s=e.target.closest('[data-s]');if(s){go(+s.dataset.s);if(s.closest('.trail'))$('panel').scrollIntoView({behavior:AAC.reduced()?'auto':'smooth',block:'start'});return}const g=e.target.closest('[data-go]');if(g){const v=+g.dataset.go;go(v===0?0:cur+v)}});
document.addEventListener('keydown',e=>{const s=e.target.closest&&e.target.closest('.stop');if(s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(+s.dataset.s)}});
function render(){$('h1').textContent=t('h1');$('sub').textContent=t('sub');$('legal').textContent=t('legal');$('foot').textContent=t('foot');document.title=t('h1');carAt=null;scene();trail();panel()}
AAC.deco($('deco'),[['map',8,10,64,-8],['flag',44,58,44,8],['car',80,16,58,0],['seedling',30,62,40,6]]);
AAC.page(()=>L,l=>L=l,render);
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
</body>
</html>
