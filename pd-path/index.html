<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AACademy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* IDEA the front door to AACademy: four levels as a climb, each card in its certificate colour
   LAYOUT intro, four level cards in a row (two by two on tablet, stacked on phone), what it asks, then two buttons */
:root{--band:#1e6b38;--maxw:1040px;--decol:72%}
.lede{font-size:clamp(18px,2.2vw,21px);margin:0 0 6px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 4px;counter-reset:lv}
.lv{position:relative;border-radius:24px;padding:18px 16px 16px;background:var(--lc);color:#fff;display:flex;flex-direction:column;gap:6px;min-height:280px}
.lv .ic{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.lv .ic img{width:40px}
.lv .n{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:1}
.lv h2{margin:0;font-size:26px;line-height:1.05}
.lv .time{font-weight:700;font-size:15px;background:rgba(0,0,0,.18);border-radius:999px;padding:3px 10px;align-self:flex-start}
.lv p{margin:4px 0 0;font-size:15.5px;line-height:1.4}
.lv .done{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.35);font-size:14px}
.lv .done b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:1}
.lv:not(:last-child)::after{content:'';position:absolute;right:-12px;top:44px;width:10px;height:10px;border-top:3px solid var(--soft);border-right:3px solid var(--soft);transform:rotate(45deg);opacity:.5}
.asks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.ask{background:var(--tint);border-radius:18px;padding:14px 16px}
.ask img{width:34px}
.ask b{display:block;font-size:17px;margin:4px 0 2px}
.ask span{font-size:15px;color:var(--soft)}
.free{display:flex;gap:14px;align-items:center;background:#ebfbee;color:#0b3d16;border-radius:20px;padding:14px 18px;margin-top:16px}
.free img{width:44px;flex:none}
.go-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.go-row .btn{min-height:52px;font-size:18px;padding:12px 24px;text-decoration:none;display:inline-flex;align-items:center}
.soon{display:inline-flex;align-items:center;min-height:52px;padding:12px 24px;border-radius:999px;font-size:18px;font-weight:700;background:var(--tint);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.note{font-size:14px;color:var(--soft);margin-top:10px}
@media(max-width:900px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.lv::after{display:none}}
@media(max-width:560px){.levels,.asks{grid-template-columns:1fr}.lv{min-height:0}}
</style>
</head>
<body>
<header class="band has-hero"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button></div></div>
  <img class="hero" id="hero" src="../shared/art/staff-training.jpg" alt="" data-en="Teachers working together at a training table." data-es="Maestros trabajando juntos en una capacitación." width="960" height="540">
</div></header>
<main class="wrap">
  <section class="card" id="intro"></section>
  <section class="card" id="lv"></section>
  <section class="card" id="how"></section>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script>
/* Links. SIGNUP_URL is the AACademy Sign-Up form. Paste the AACademy Check-In link into CHECKIN_URL once it exists;
   until then that button stays hidden. This page lives at the old PD Path address so old links still land here. */
/* AACademy isn't open yet. Change false to true on launch day and the sign-up and check-in buttons come back. */
const OPEN=false;
const SIGNUP_URL='https://docs.google.com/forms/d/e/1FAIpQLSdV8TxNrIFUcIBIQgvfbFfFzZ09WVMHHUuN4C9zvKd6DljwBw/viewform';
const CHECKIN_URL='https://docs.google.com/forms/d/e/1FAIpQLSfgV1gc7jxy3Q9dfNgkHOOE7wCR0tsZ0K7zoqmxn2dd3iWfvQ/viewform';
const {esc,sym}=AAC,$=id=>document.getElementById(id);
let L=AAC.pageLang();
const LV=[
 {c:'#1972c2',ic:sym('rocket'),en:{h:'AACtivate',t:'About 90 minutes, over 1 to 2 weeks',p:'Five short modules on why AAC matters and how devices work. Run the VOICE Check in your room, try your student\'s app, and pass a ten-question scenario check.',d:'All ten right, and your classroom task is in.'},
  es:{h:'AACtivate',t:'Unos 90 minutos, en 1 a 2 semanas',p:'Cinco módulos cortos sobre por qué importa la CAA y cómo funcionan los dispositivos. Haga la revisión VOICE en su salón, practique en la aplicación de su estudiante y apruebe una prueba de diez situaciones.',d:'Las diez correctas y su tarea del salón entregada.'}},
 {c:'#28803a',ic:sym('speaking'),en:{h:'PrAACtice',t:'About 45 minutes, then 2 minutes a day for 2 weeks',p:'Learn to model, wait and ask real questions. Pick one daily routine and two or three core words, model them on at least 8 of 10 school days, and log each day.',d:'Eight days logged and a short reflection.'},
  es:{h:'PrAACtice',t:'Unos 45 minutos, y luego 2 minutos al día por 2 semanas',p:'Aprenda a modelar, esperar y hacer preguntas reales. Escoja una rutina diaria y dos o tres palabras clave, modélelas al menos 8 de 10 días de clase y regístrelo cada día.',d:'Ocho días registrados y una reflexión corta.'}},
 {c:'#7048e8',ic:sym('book'),en:{h:'TeAACh',t:'About 90 minutes, plus one lesson',p:'Go beyond requesting with shared reading, spelling, peers, behavior and safety words. Build AAC into a lesson you already teach, then host a short coaching visit.',d:'Your lesson plan, a photo and one visit.'},
  es:{h:'TeAACh',t:'Unos 90 minutos, más una lección',p:'Vaya más allá de pedir con lectura compartida, deletreo, compañeros, conducta y palabras para estar seguro. Incluya la CAA en una lección que ya enseña y reciba una visita corta de apoyo.',d:'Su plan de lección, una foto y una visita.'}},
 {c:'#ab5900',ic:sym('trophy'),en:{h:'CoAACh',t:'A few hours across the year',p:'By invitation, about one per school. Be the go-to person for AAC at your site: support one colleague, lead one short refresher and join three meetups.',d:'Invited after TeAACh.'},
  es:{h:'CoAACh',t:'Unas horas durante el año',p:'Por invitación, más o menos uno por escuela. Sea la persona de referencia para la CAA en su escuela: apoye a un colega, dirija un repaso corto y participe en tres reuniones.',d:'Por invitación después de TeAACh.'}}];
const T={
 en:{h1:'AACademy',sub:'Rialto\'s AAC training path for classroom staff. Four levels, real practice with your students.',
  lede:'AACademy takes you from knowing what AAC is to being the person others at your school come to. Every level asks you to try something with your students, not just watch a video.',
  who:'For teachers and paras who work with students who use AAC. You start at AACtivate and move up at your own pace.',
  lvh:'The four levels',n:'Level',done:'Done when',howh:'What it asks of you',
  asks:[[sym('stopwatch'),'Real time','Each level takes days or weeks of classroom use, so nobody finishes in one sitting.'],[sym('target'),'Real practice','You model with your own students and log it. That\'s where the learning happens.'],[sym('medal'),'Real recognition','A certificate and email badge at each level, listing what you showed you can do.']],
  free:'Every tool and printable on this site is free to use with students right now, with or without AACademy. AACademy is for you.',
  soon:'Coming soon',soonP:'Sign-up isn’t open yet. Check back here.',signup:'Sign up for AACademy',checkin:'Send a check-in',note:'Both forms ask you to sign in with your RUSD account.',
  foot:'AACademy is run by the District AAC Specialist. Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
 es:{h1:'AACademy',sub:'La ruta de capacitación en CAA de Rialto para el personal del salón. Cuatro niveles, práctica real con sus estudiantes.',
  lede:'AACademy lo lleva de saber qué es la CAA a ser la persona a quien otros en su escuela acuden. Cada nivel le pide probar algo con sus estudiantes, no solo ver un video.',
  who:'Para maestros y asistentes que trabajan con estudiantes que usan CAA. Empieza en AACtivate y avanza a su propio ritmo.',
  lvh:'Los cuatro niveles',n:'Nivel',done:'Termina cuando',howh:'Lo que le pide',
  asks:[[sym('stopwatch'),'Tiempo real','Cada nivel toma días o semanas de uso en el salón, así que nadie termina en una sola sesión.'],[sym('target'),'Práctica real','Usted modela con sus propios estudiantes y lo registra. Ahí es donde se aprende.'],[sym('medal'),'Reconocimiento real','Un certificado y una insignia para su correo en cada nivel, con lo que demostró que puede hacer.']],
  free:'Todas las herramientas e imprimibles de este sitio son gratis para usar con los estudiantes ahora mismo, con o sin AACademy. AACademy es para usted.',
  soon:'Próximamente',soonP:'La inscripción aún no está abierta. Vuelva a visitar esta página.',signup:'Inscribirse en AACademy',checkin:'Enviar un registro',note:'Los dos formularios le piden entrar con su cuenta de RUSD.',
  foot:'AACademy está a cargo del Especialista de CAA del distrito. Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const t=k=>T[L][k];
function render(){
 $('h1').textContent=t('h1');$('sub').textContent=t('sub');$('foot').textContent=t('foot');document.title=t('h1');
 $('intro').innerHTML=`<p class="lede">${esc(t('lede'))}</p><p>${esc(t('who'))}</p>`;
 $('lv').innerHTML=`<h2 style="margin:0">${esc(t('lvh'))}</h2><div class="levels">${LV.map((v,i)=>{const x=v[L];return `<article class="lv" style="--lc:${v.c}"><div class="ic"><img src="${v.ic}" alt=""></div><span class="n">${esc(t('n'))} ${i+1}</span><h2>${esc(x.h)}</h2><span class="time">${esc(x.t)}</span><p>${esc(x.p)}</p><div class="done"><b>${esc(t('done'))}</b>${esc(x.d)}</div></article>`}).join('')}</div>`;
 $('how').innerHTML=`<h2 style="margin:0">${esc(t('howh'))}</h2><div class="asks">${t('asks').map(([i,b,s])=>`<div class="ask"><img src="${i}" alt=""><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('')}</div>
 <div class="free"><img src="${sym('heart')}" alt=""><span>${esc(t('free'))}</span></div>
 ${OPEN?`<div class="go-row"><a class="btn go" href="${esc(SIGNUP_URL)}" target="_blank" rel="noopener">${esc(t('signup'))}</a>${CHECKIN_URL?`<a class="btn ghost" href="${esc(CHECKIN_URL)}" target="_blank" rel="noopener">${esc(t('checkin'))}</a>`:''}</div><p class="note">${esc(t('note'))}</p>`:`<div class="go-row"><span class="soon">${esc(t('soon'))}</span></div><p class="note">${esc(t('soonP'))}</p>`}`}
AAC.deco($('deco'),[['rocket',8,12,56,-8],['star',48,60,40,8],['trophy',82,14,52,6],['grad',30,66,42,-6]]);
(function(){const h=document.getElementById('hero');const sync=()=>{if(h)h.alt=h.dataset[document.documentElement.lang==='es'?'es':'en']};new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});sync()})();
AAC.page(()=>L,l=>L=l,render);
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
<script src="../shared/keep-lang.js"></script>
</body>
</html>
