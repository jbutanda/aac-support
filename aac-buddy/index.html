<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAC Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* VOICE for kids: short sentences, big pictures, read aloud
   IDEA a picture book with a badge at the end, like a junior ranger program
   PICTURE one giant symbol per page above two lines of text; a shiny badge to finish
   COLOUR bright green band, white pages, gold badge
   TYPE Atkinson Hyperlegible, big
   LAYOUT one page at a time with big next/back buttons; quiz with two picture choices; badge prints alone */
:root{--band:#2b8a3e;--maxw:820px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--go);transform:scale(1.25)}
.pg{text-align:center}
.pg .art{width:clamp(130px,26vw,190px);height:clamp(130px,26vw,190px);margin:4px auto 10px;border-radius:50%;background:#ebfbee;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
:root[data-theme=dark] .pg .art{background:#13301b}
.pg .art img{width:62%}
.pg h2{font-size:clamp(30px,5vw,42px);margin:0 0 6px}
.pg p{font-size:clamp(19px,2.6vw,23px);max-width:34ch;margin:0 auto 14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.bdev{text-align:left;margin:0 0 12px}
.bdev .gw{overflow-x:auto}
.say{font:inherit;font-weight:700;min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.ch button{font:inherit;font-weight:700;font-size:19px;border-radius:20px;border:3px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;padding:14px;display:grid;gap:8px;justify-items:center}
.ch img{width:72px}
.ch button.ok{border-color:var(--go);background:var(--gobg)}
.ch button.bad{border-color:#c2410c;background:light-dark(#fff1e8,#3a1d10);animation:shake .35s}
.badge{width:min(320px,80vw);aspect-ratio:1/1;margin:8px auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3bf,#fcc419 60%,#e67700);display:grid;place-items:center;box-shadow:0 0 0 10px #fff,0 0 0 16px #fcc419,0 18px 40px rgba(0,0,0,.2);text-align:center;color:#3d2c00;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.badge img{width:30%}
.badge b{display:block;font-size:clamp(26px,5vw,38px);line-height:1}
.badge span{display:block;font-weight:700;font-size:clamp(16px,2.6vw,20px);margin-top:6px;max-width:80%;margin-left:auto;margin-right:auto;overflow-wrap:anywhere}
.nm{max-width:320px;margin:0 auto 12px;display:grid;gap:6px;font-weight:700}
@media print{body *{visibility:hidden}#card,#card .badge,#card .badge *{visibility:visible}.nm,.nav,.noprint{display:none!important}}
</style>
</head>
<body>
<header class="band"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button><label class="vc"><span id="vlab">Voice</span><select id="voice"></select></label></div></div>
</div></header>
<main class="wrap">
  <section class="card" id="card"></section>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script src="../shared/vocab.js"></script>
<script src="../shared/device.js"></script>
<script>
{
const {byId,sym,speak,hush,voiceSelect,langToggle,keyHtml,confetti,esc}=AAC;
const TS='../talker/symbols/';
const P=[
 {img:TS+'say.svg',en:['Meet the AAC device','Some kids talk with their mouths. Some kids talk with an AAC device. Tap a word, and the AAC device says it.'],es:['Conoce el dispositivo de CAA','Algunos niños hablan con la boca. Otros hablan con un dispositivo de CAA. Tocas una palabra y el dispositivo de CAA la dice.']},
 {img:sym('wave'),en:['Say hi!','Say hi like you would to any friend. Look at them, not their helper, and ask them a question.'],es:['¡Saluda!','Saluda como saludarías a cualquier amigo. Míralo a él, no a quien lo ayuda, y hazle una pregunta.']},
 {img:TS+'wait.svg',en:['Wait','Finding words takes time. Count to 10 in your head. Don’t guess, and don’t finish for them.'],es:['Espera','Encontrar palabras toma tiempo. Cuenta hasta 10 en tu mente. No adivines ni termines por él.']},
 {board:true,img:TS+'look.svg',en:['Show them','You can use the AAC device too! Touch a word while you say it. Try it here:'],es:['Muéstrale','¡Tú también puedes usar el dispositivo de CAA! Toca una palabra mientras la dices. Pruébalo aquí:']},
 {img:TS+'stop.svg',en:['It’s their voice','An AAC device is how your friend talks. Never take it away, and ask before you touch it.'],es:['Es su voz','El dispositivo de CAA es la forma en que tu amigo habla. Nunca se lo quites y pregunta antes de tocarlo.']},
 {img:sym('play'),en:['Have fun together','Play, joke and hang out. Kids who use AAC devices want friends, just like you.'],es:['Diviértanse juntos','Jueguen, bromeen y pasen tiempo juntos. Los niños que usan un dispositivo de CAA quieren amigos, igual que tú.']}];
const Q=[
 {en:'Your friend is finding a word. What do you do?',es:'Tu amigo está buscando una palabra. ¿Qué haces?',a:[{img:TS+'wait.svg',en:'Wait',es:'Espero',ok:1},{img:TS+'say.svg',en:'Say it for them',es:'La digo por él',ok:0}]},
 {en:'Can you take your friend’s AAC device?',es:'¿Puedes quitarle el dispositivo de CAA a tu amigo?',a:[{img:TS+'get.svg',en:'Yes, if I want to',es:'Sí, si quiero',ok:0},{img:TS+'stop.svg',en:'No, it’s their voice',es:'No, es su voz',ok:1}]},
 {en:'Who do you talk to?',es:'¿A quién le hablas?',a:[{img:TS+'you.svg',en:'My friend',es:'A mi amigo',ok:1},{img:TS+'he.svg',en:'The grown-up helping',es:'Al adulto que ayuda',ok:0}]}];
const T={
 en:{h1:'AAC Buddy',sub:'Learn how to be a great friend to kids who talk with an AAC device. Then earn your badge!',back:'Back',next:'Next',read:'Read it to me',quiz:'Quick check',got:'You got it!',try:'Try the other one.',badge:'Get my badge',name:'Your first name',bb:'AAC BUDDY',print:'Print my badge',again:'Start over',
  foot:'For classmates in any grade. Read it together as a class or one-on-one. Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
 es:{h1:'Amigo CAA',sub:'Aprende a ser un gran amigo de los niños que hablan con un dispositivo de CAA. ¡Luego gana tu insignia!',back:'Atrás',next:'Siguiente',read:'Léemelo',quiz:'Repaso rápido',got:'¡Muy bien!',try:'Prueba la otra.',badge:'Ver mi insignia',name:'Tu nombre',bb:'AMIGO CAA',print:'Imprimir mi insignia',again:'Empezar de nuevo',
  foot:'Para compañeros de cualquier grado. Léanlo juntos en clase o uno a uno. Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const QL=()=>{try{const q=new URLSearchParams(location.search).get('lang');return q==='es'||q==='en'?q:''}catch(e){return ''}};const S={lang:QL()||'en',i:0,qi:0,picked:null,name:''};
const $=id=>document.getElementById(id);
const total=P.length+Q.length+1;
const render=()=>{const t=T[S.lang],es=S.lang==='es';document.documentElement.lang=S.lang;$('h1').textContent=t.h1;$('sub').textContent=t.sub;$('foot').textContent=t.foot;$('vlab').textContent=es?'Voz':'Voice';
 const dots=`<div class="dots noprint">${Array.from({length:total},(_,k)=>`<i class="${k<=S.i?'on':''}"></i>`).join('')}</div>`;
 if(S.i<P.length){const p=P[S.i],[h,x]=p[S.lang];
  $('card').innerHTML=dots+`<div class="pg"><div class="art"><img src="${p.img}" alt=""></div><h2>${h}</h2><p>${x}</p>${p.board?`<div class="device bdev"><div class="gw"><div id="bdv"></div></div><p class="swipe">${es?'Desliza para ver todo el tablero.':'Swipe to see the whole board.'}</p></div>`:''}<button class="say" id="read">${t.read}</button></div><div class="nav"><button class="btn ghost" id="back"${S.i===0?' disabled':''}>${t.back}</button><button class="btn go" id="next">${t.next}</button></div>`;if(p.board)AAC.Device($('bdv'),{lang:()=>S.lang,onPick:w=>speak(w[S.lang],S.lang)});return}
 const qi=S.i-P.length;
 if(qi<Q.length){const q=Q[qi];
  $('card').innerHTML=dots+`<div class="pg"><h2>${t.quiz}</h2><p>${es?q.es:q.en}</p><div class="ch">${q.a.map((a,j)=>`<button data-a="${j}" class="${S.picked===j?(a.ok?'ok':'bad'):''}"><img src="${a.img}" alt="">${es?a.es:a.en}</button>`).join('')}</div><p style="margin-top:14px;font-weight:700;min-height:1.4em">${S.picked!=null?(q.a[S.picked].ok?t.got:t.try):''}</p></div><div class="nav"><button class="btn ghost" id="back">${t.back}</button><button class="btn go" id="next"${S.picked!=null&&q.a[S.picked].ok?'':' disabled'}>${qi===Q.length-1?t.badge:t.next}</button></div>`;return}
 $('card').innerHTML=dots+`<div class="pg"><label class="nm noprint">${t.name}<input class="in" id="nm" value="${esc(S.name)}" maxlength="24"></label><div class="badge"><div><img src="${sym('star')}" alt=""><b>${t.bb}</b><span id="bn">${esc(S.name)||'★'}</span></div></div><div class="row noprint" style="justify-content:center"><button class="btn go" id="print">${t.print}</button><button class="btn ghost" id="again">${t.again}</button></div></div>`};
$('card').addEventListener('click',e=>{const t=T[S.lang];
 if(e.target.closest('#next')){hush();S.i++;S.picked=null;render();if(S.i===total-1)setTimeout(()=>confetti($('card'),120),150);return}
 if(e.target.closest('#back')){hush();S.i=Math.max(0,S.i-1);S.picked=null;render();return}
 if(e.target.closest('#read')){const[h,x]=P[S.i][S.lang];speak(h+'. '+x,S.lang);return}
 if(e.target.closest('#bdv'))return;
 const a=e.target.closest('[data-a]');if(a){S.picked=+a.dataset.a;render();const q=Q[S.i-P.length];speak(q.a[S.picked].ok?t.got:t.try,S.lang);return}
 if(e.target.closest('#print')){try{window.print()}catch(err){}return}
 if(e.target.closest('#again')){S.i=0;S.picked=null;render()}});
$('card').addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value;$('bn').textContent=S.name||'★'}});
langToggle($('langs'),()=>S.lang,l=>{S.lang=l;fill();render()});
const fill=voiceSelect($('voice'),()=>S.lang);
$('deco').innerHTML=[['buddy',12,12,60,-8],['star',48,58,44,8],['wave',80,14,52,-6],['play',30,60,46,10]].map(([n,x,y,z,r],i)=>`<img src="${sym(n)}" alt="" style="left:${x}%;top:${y}%;width:${z}px;transform:rotate(${r}deg);animation-delay:${-i}s">`).join('');
render();
}
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
</body>
</html>
