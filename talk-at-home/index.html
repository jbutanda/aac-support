<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk at Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* IDEA a fridge card for each part of the day: four words, one phrase each, one tip
   LAYOUT routine picker -> fridge card (magnets, keys, phrases) -> three reminders; prints as one card */
:root{--band:#9c36b5;--maxw:1000px;--decol:70%}
.lead{font-size:19px;margin:0 0 14px}
.routines{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rt{font:inherit;font-weight:700;border:0;border-radius:20px;background:var(--rc);color:#1d2026;cursor:pointer;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:104px;transition:transform .15s,box-shadow .15s;font-size:15px;text-align:center;line-height:1.15}
.rt img{width:52px;transition:transform .3s}
.rt:hover img{transform:scale(1.12) rotate(-6deg)}
.rt[aria-pressed=true]{box-shadow:0 0 0 4px var(--card),0 0 0 7px #9c36b5;transform:translateY(-3px)}
.fridge{margin:22px auto 0;max-width:820px;background:#fffdf7;color:#1d2026;border-radius:10px;padding:34px clamp(16px,4vw,36px) 26px;position:relative;box-shadow:0 2px 0 #e9e2cf,0 18px 40px rgba(60,40,10,.18);transform:rotate(-.6deg);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.fridge::before,.fridge::after{content:'';position:absolute;top:-14px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8fab,#d6336c);box-shadow:0 4px 8px rgba(0,0,0,.25)}
.fridge::before{left:28px}.fridge::after{right:28px;background:radial-gradient(circle at 35% 35%,#74c0fc,#1971c2)}
.fhd{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.fhd img{width:66px}
.fhd h2{margin:0;font-size:clamp(26px,4vw,36px);color:#1d2026}
.fhd p{margin:0;color:#5b6170}
.words{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.wd{text-align:center}
.wd .k{width:100%;max-width:130px;margin:0 auto 8px;aspect-ratio:1/1;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.wd .k img{width:60%;max-width:72px}
.wd .k .w{font-size:clamp(14px,1.8vw,19px)}
.wd .k.lit{transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 0 0 7px #9c36b5}
.ph{font:inherit;border:0;background:#f3e8ff;color:#3b0764;border-radius:14px;padding:8px 10px;cursor:pointer;width:100%;font-size:16px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px}
.ph svg{flex:none}
.tip{margin:20px 0 0;background:#fff3bf;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;color:#2b2200}
.tip img{width:38px;flex:none}
.tip p{margin:0;font-size:17px}
.remind{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.rm{background:var(--tint);border-radius:18px;padding:16px}
.rm b{display:block;font-size:17px;margin-bottom:2px}
.rm p{margin:0}
.acts{justify-content:center;margin-top:18px}
@media(max-width:760px){.routines{grid-template-columns:repeat(3,minmax(0,1fr))}.remind{grid-template-columns:1fr}}
@media(max-width:560px){.words{grid-template-columns:repeat(2,minmax(0,1fr))}.fridge{transform:none}.routines{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.routines,.lead,.remind,.acts{display:none!important}.fridge{box-shadow:none;transform:none;border:2px solid #999;margin:0 auto}.ph{background:#fff;border:1px solid #ccc}.ph svg{display:none}}
</style>
</head>
<body>
<header class="band"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button><label class="vc"><span id="vlab">Voice</span><select id="voice"></select></label></div></div>
</div></header>
<main class="wrap">
  <section class="card">
    <p class="lead noprint"><b id="lead"></b></p>
    <div class="routines" id="routines"></div>
    <div id="card"></div>
    <div class="row acts noprint"><button class="btn" id="print" style="background:#9c36b5;color:#fff"></button></div>
    <div class="remind" id="remind"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script>
const {esc,sym,byId,speak}=AAC,$=id=>document.getElementById(id);
let L=AAC.pageLang(),cur=AAC.store.get('tah-r','meal');
const T={en:{h1:'Talk at Home',sub:'Pick a part of your day. Get four words to model and ideas for using them.',lead:'Which part of the day?',words:'Four words to model',print:'Print this card',vlab:'Voice',
 rm:[['Show, don’t test','Touch the word as you say it. Skip “Say more” or “What’s this?”'],['One word is plenty','You don’t need to tap every word you say. Touch one or two key words.'],['Pause and wait','After you model, wait and look at your child. Give them time to try.']],foot:'Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
es:{h1:'Hablemos en casa',sub:'Elija una parte de su día. Reciba cuatro palabras para modelar e ideas para usarlas.',lead:'¿Qué parte del día?',words:'Cuatro palabras para modelar',print:'Imprimir esta tarjeta',vlab:'Voz',
 rm:[['Muestre, no examine','Toque la palabra mientras la dice. Evite “Di más” o “¿Qué es esto?”'],['Una palabra es suficiente','No tiene que tocar cada palabra que dice. Toque una o dos palabras clave.'],['Haga una pausa y espere','Después de modelar, espere y mire a su hijo. Dele tiempo para intentarlo.']],foot:'Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const R=[
{id:'meal',ic:'plate',c:'#ffd8a8',en:'Mealtime',es:'La comida',w:[['more','More, please.','Más, por favor.'],['eat','Let’s eat!','¡Vamos a comer!'],['drink','Drink your water.','Toma tu agua.'],['alldone','All done eating?','¿Terminaste de comer?']],
 ten:'Give a small amount first. When it’s gone, touch MORE and wait a few seconds before giving more.',tes:'Sirva una porción pequeña. Cuando se acabe, toque MÁS y espere unos segundos antes de servir más.'},
{id:'bath',ic:'bath',c:'#a5d8ff',en:'Bath time',es:'El baño',w:[['in','In the water!','¡Dentro del agua!'],['hot','Ooh, hot water.','Uy, agua caliente.'],['cold','Brr, cold!','¡Brr, frío!'],['put','Put soap on.','Pon jabón.']],
 ten:'Keep the device or a waterproof board near the tub. A sealed sandwich bag over a printed board works great.',tes:'Tenga el dispositivo o un tablero a prueba de agua cerca. Un tablero impreso en una bolsa sellada funciona muy bien.'},
{id:'car',ic:'car',c:'#ffc9c9',en:'In the car',es:'En el carro',w:[['go','Green light. Go!','Luz verde. ¡Vamos!'],['stop','Red light. Stop.','Luz roja. Para.'],['where','Where are we going?','¿A dónde vamos?'],['look','Look, a bus!','¡Mira, un autobús!']],
 ten:'Talk about what you see out the window. Car rides are full of GO and STOP moments.',tes:'Hable de lo que ven por la ventana. Los viajes en carro están llenos de momentos para IR y PARAR.'},
{id:'bed',ic:'bed',c:'#d0bfff',en:'Bedtime',es:'La hora de dormir',w:[['read','Read a book.','Leer un libro.'],['again','Again! One more time.','¡Otra vez! Una vez más.'],['turn','Your turn to pick.','Tu turno de escoger.'],['feel','I feel sleepy.','Me siento con sueño.']],
 ten:'Read the same favorite book for a while. Repetition gives your child chances to join in.',tes:'Lea el mismo libro favorito por un tiempo. La repetición le da a su hijo oportunidades de participar.'},
{id:'dress',ic:'shirt',c:'#b2f2bb',en:'Getting dressed',es:'Vestirse',w:[['put','Put on your shoes.','Ponte los zapatos.'],['up','Arms up!','¡Brazos arriba!'],['help','Help me, please.','Ayúdame, por favor.'],['different','A different shirt?','¿Otra camisa diferente?']],
 ten:'Offer two choices and model DIFFERENT when your child wants the other one.',tes:'Ofrezca dos opciones y modele DIFERENTE cuando su hijo quiera la otra.'},
{id:'play',ic:'play',c:'#ffec99',en:'Playtime',es:'La hora de jugar',w:[['play','Let’s play!','¡Vamos a jugar!'],['turn','My turn, your turn.','Mi turno, tu turno.'],['make','Make a tower.','Hacer una torre.'],['again','Again!','¡Otra vez!']],
 ten:'Let your child lead the play. Model words about what they are already doing.',tes:'Deje que su hijo dirija el juego. Modele palabras sobre lo que ya está haciendo.'},
{id:'tv',ic:'tv',c:'#c5f6fa',en:'Shows and videos',es:'Programas y videos',w:[['like','I like this one.','Me gusta este.'],['look','Look! A dog.','¡Mira! Un perro.'],['stop','Stop. Pause it.','Para. Ponle pausa.'],['different','Something different?','¿Algo diferente?']],
 ten:'Watch together and pause now and then to comment. Shows are a great way to talk about feelings.',tes:'Vean juntos y hagan pausas para comentar. Los programas son buenos para hablar de sentimientos.'},
{id:'store',ic:'cart',c:'#eebefa',en:'At the store',es:'En la tienda',w:[['need','We need eggs.','Necesitamos huevos.'],['get','Get the milk.','Agarra la leche.'],['put','Put it in the cart.','Ponlo en el carrito.'],['where','Where is the bread?','¿Dónde está el pan?']],
 ten:'Give your child one or two items to find. Make a quick list on the device before you leave.',tes:'Dele a su hijo una o dos cosas para buscar. Hagan una lista rápida en el dispositivo antes de salir.'},
{id:'outside',ic:'tree',c:'#d3f9d8',en:'Outside',es:'Afuera',w:[['go','Ready, set, go!','¡En sus marcas, listos, ya!'],['up','Up, up, up!','¡Arriba, arriba!'],['look','Look at the bird.','Mira el pájaro.'],['again','Push again!','¡Empuja otra vez!']],
 ten:'Swings and slides are perfect for GO and AGAIN. Stop the swing and wait for your child to ask.',tes:'Los columpios y resbaladeros son perfectos para IR y OTRA VEZ. Detenga el columpio y espere a que su hijo pida.'},
{id:'cook',ic:'cook',c:'#ffe3e3',en:'Cooking',es:'Cocinar',w:[['help','Help me stir.','Ayúdame a mover.'],['open','Open the bag.','Abre la bolsa.'],['put','Put it in.','Ponlo adentro.'],['hot','Careful, hot!','¡Cuidado, caliente!']],
 ten:'Let your child do one real job, like pouring or stirring. Real jobs give real reasons to talk.',tes:'Deje que su hijo haga un trabajo real, como echar o mover. Los trabajos reales dan razones reales para hablar.'}];
const t=k=>T[L][k];
const spk='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
function render(){
 $('h1').textContent=t('h1');$('sub').textContent=t('sub');$('lead').textContent=t('lead');$('print').textContent=t('print');$('vlab').textContent=t('vlab');$('foot').textContent=t('foot');document.title=t('h1');
 $('routines').innerHTML=R.map(r=>`<button class="rt" data-r="${r.id}" style="--rc:${r.c}" aria-pressed="${r.id===cur}"><img src="${sym(r.ic)}" alt="">${esc(r[L])}</button>`).join('');
 const r=R.find(x=>x.id===cur)||R[0];
 $('card').innerHTML=`<article class="fridge" aria-live="polite"><div class="fhd"><img src="${sym(r.ic)}" alt=""><div><h2>${esc(r[L])}</h2><p>${t('words')}</p></div></div>
 <div class="words">${r.w.map(([id,en,es],i)=>{const w=byId[id];return `<div class="wd">${AAC.keyHtml(w,L,`data-say="${i}"`)}<button class="ph" data-say="${i}">${spk}<span>${esc(L==='es'?es:en)}</span></button></div>`}).join('')}</div>
 <div class="tip"><img src="${sym('bulb')}" alt=""><p>${esc(L==='es'?r.tes:r.ten)}</p></div></article>`;
 $('remind').innerHTML=t('rm').map(([b,p])=>`<div class="rm"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join('');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-r]');if(b){cur=b.dataset.r;AAC.store.set('tah-r',cur);render();return}
 const s=e.target.closest('[data-say]');if(s){const r=R.find(x=>x.id===cur),i=+s.dataset.say,[id,en,es]=r.w[i];const key=document.querySelector(`.k[data-say="${i}"]`);
  key.classList.add('lit');setTimeout(()=>key.classList.remove('lit'),900);
  speak(s.classList.contains('k')?byId[id][L]:(L==='es'?es:en),L)}
});
$('print').onclick=()=>print();
AAC.deco($('deco'),[['home',8,10,62,-6],['plate',46,56,44,8],['bath',80,12,54,6],['car',28,60,44,-4]]);
AAC.page(()=>L,l=>L=l,render);
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
</body>
</html>
