<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wait For It</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* IDEA a patience game: ask, then hold back while the student finds their words. Jump in too soon and you miss what they were about to say
   LAYOUT stage (student + thinking dots + optional ring) with Ask / Jump in buttons; results chart of your six waits against the 5 to 10 second zone */
:root{--band:#4d7d0b;--maxw:900px;--decol:70%}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hud b{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.part{font-weight:700;border-radius:999px;padding:4px 12px;background:#d8f5a2;color:#2b4a00;font-size:14px}
.stage{position:relative;border-radius:26px;background:radial-gradient(circle at 50% 40%,#f4fce3,#e9fac8 60%,#d8f5a2);padding:26px 18px 22px;text-align:center;color:#16181d;overflow:hidden}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stage{background:radial-gradient(circle at 50% 40%,#25331a,#1e2a14 60%,#18230f);color:#eceef2}}
.qq{font-size:clamp(20px,3vw,26px);font-weight:700;margin:0 auto 14px;max-width:30ch;min-height:2.4em}
.qq small{display:block;font-size:15px;font-weight:400;opacity:.75}
.who{position:relative;width:200px;height:200px;margin:0 auto}
.who svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.who svg.ring circle{fill:none;stroke-width:12}
.who .bg{stroke:rgba(92,148,13,.18)}
.who .fg{stroke:#4d7d0b;stroke-linecap:round;transition:stroke .3s}
.who .zone{stroke:#94d82d;opacity:.55}
.av{position:absolute;inset:26px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.av img{width:96px}
.name{font-weight:700;margin:8px 0 0;font-size:18px}
.think{position:absolute;right:-6px;top:-4px;background:#fff;border-radius:22px;padding:10px 14px;display:flex;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.12);opacity:0;transition:opacity .3s}
.think.on{opacity:1}
.think i{width:10px;height:10px;border-radius:50%;background:#4d7d0b;animation:dot 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes dot{40%{transform:translateY(-6px);opacity:.4}}
.ans{min-height:110px;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.ans .k{width:96px;animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.ans .k img{width:60%}
.cue{font-size:18px;min-height:1.6em;margin:6px 0 0;font-weight:700;color:#2b4a00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .cue{color:#c0eb75}}
.secs{font-variant-numeric:tabular-nums;font-size:15px;opacity:.75;margin:2px 0 0;min-height:1.4em}
.btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn.act{background:#fff;color:#16181d;border:2px solid #c9d3c0;font-size:16px;padding:10px 16px;min-height:48px}
.btn.act:hover{border-color:#4d7d0b}
.waitnote{font-size:15px;opacity:.8;margin:10px 0 0}
.ans .k.mod{opacity:.9;box-shadow:0 0 0 3px #74c0fc}
.ans .lab{font-weight:700;font-size:15px;opacity:.8}
.result.soft{background:#fff9db;color:#3d2e00}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;margin:6px 0 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.btn.ask{background:#4d7d0b;color:#fff;font-size:19px;padding:12px 28px}
.result{margin-top:16px;border-radius:20px;padding:16px 18px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);display:flex;gap:14px;align-items:center;text-align:left}
.result img{width:52px;flex:none}
.result.good{background:#ebfbee;color:#0b3d16}
.result.miss{background:#fff4e6;color:#4a2300}
.result p{margin:0;font-size:17px}
.result b{font-size:20px;display:block}
.chart{margin:10px 0 6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:14px "Atkinson Hyperlegible",system-ui,sans-serif;fill:var(--soft)}
.chart .vl{fill:var(--ink);font-weight:700}
.tip{position:fixed;pointer-events:none;background:#16181d;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;z-index:20;display:none}
.sum{font-size:19px}
details{margin-top:10px}
table{border-collapse:collapse;width:100%;margin-top:8px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.why{background:var(--tint);border-radius:18px;padding:16px;margin-top:14px}
.why p{margin:0}
</style>
</head>
<body>
<header class="band has-hero"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button><label class="vc"><span id="vlab">Voice</span><select id="voice"></select></label></div></div>

  <img class="hero" id="hero" src="../shared/art/staff-training.jpg" alt="A teacher kneels at eye level and waits while a student taps his communication tablet." data-en="A teacher kneels at eye level and waits while a student taps his communication tablet." data-es="Una maestra se arrodilla a la altura del estudiante y espera mientras él toca su tableta de comunicación." width="960" height="540">
</div></header>
<main class="wrap">
  <section class="card" id="game"></section>
  <p class="foot" id="foot"></p>
</main>
<div class="tip" id="tip"></div>
<script src="../shared/core.js"></script><script src="../shared/vocab.js"></script><script src="../shared/device.js"></script>
<script>
const {esc,sym,byId,speak,hush,confetti}=AAC,$=id=>document.getElementById(id);
let L=AAC.pageLang(),r=0,state='ready',t0=0,raf=0,timer=0,waits=[],intro=true;
const T={en:{h1:'Wait For It',sub:'AAC users often need extra time to find their words. How long do you really wait? Find out, then practice the pause.',vlab:'Voice',
 round:'Round {a} of {b}',p1:'Part 1: Check yourself',p2:'Part 2: Practice the pause',
 introh:'Here’s how it works',intro:'You’ll ask a student a question. Then do what you would really do. If you would repeat the question, give a hint or the answer, or model on the device, tap that button when you would do it. If you would wait, just wait. Some students answer when they get time. Some need you to model first.',
 introp2:'Now the ring is on. Count slowly in your head, breathe, and let the ring fill toward the green zone. Wait first. If the student still needs help, model.',start:'Let’s go',ask:'Ask the question',next:'Next round →',
 repeat:'Repeat the question',tell:'Give a hint or the answer',model:'Model on the device',waitnote:'Or just wait. Tap a button only when you would really do it.',look:'{n} looks at you.',you:'You:',
 mod:'You waited {s} seconds, then modeled “{m}.”',modp:'{n} watched, then said “{w}.” A pause first, then a model: that’s the move.',
 early:'You modeled at {s} seconds.',earlyp:'Modeling is the right tool, but {n} was about to say “{w}” on their own. Wait first. Model when the pause is over and they still need help.',
 earlyn:'{n} did need a model this time, and it worked: they said “{w}.” Next time, give a full pause first so they get a chance to answer on their own.',
 rep:'You repeated the question at {s} seconds.',repp:'{n} was still working on “{w}.” Hearing the question again restarts their thinking. A quiet wait helps more.',repn:'{n} heard the question the first time. What they needed was to see how to say it. Wait, then model.',
 tel:'You gave the answer at {s} seconds.',telp:'{n} was about to say “{w}.” When we answer for students, they learn someone else will talk for them.',teln:'When we answer for students, they learn someone else will talk for them. After a pause, model on the device instead, then hand the turn back.',
 stall:'You waited {s} seconds.',stallp:'Great patience. But {n} looked to you for help. After about 10 seconds with no answer, model a few words on the device, then wait again.',
 res:{wait:'answered after a wait',modeled:'waited, then modeled',early:'modeled early',repeat:'repeated the question',tell:'gave the answer',stall:'waited, no model'},
 lg:{good:'Right move',soft:'Close',miss:'Took over the turn'},sum:'{g} of {n} rounds went the way students need.',
 cues:['','Count in your head…','Keep looking at them…','Breathe…','Almost there…'],
 good:'You waited {s} seconds, and {n} answered!',goodp:'That pause gave {n} time to find the words.',
 endh:'Your waits',avg:'Your average wait: {s} seconds.',zone:'The green band is the 5 to 10 second zone.',
 sumMid:'You’re giving real wait time. The next step is what comes after the pause: model on the device instead of repeating the question or answering for them.',sumHi:'You gave students time, and when they needed help you modeled instead of answering for them. That is the habit.',sumLo:'Most of us jump in fast. Classroom research has found adults often wait about a second. With practice, the pause gets easier.',
 why:'Why it matters: finding a word on an AAC device takes planning and motor steps. When we jump in, students learn that someone else will talk for them. A quiet pause tells them their turn is coming. Wait first. If they still need help, model on their device, then wait again.',
 table:'Show as a table',tr:'Round',ts:'Seconds waited',tres:'Result',again:'Play again',sec:'{s} s',
 foot:'Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
es:{h1:'Espera',sub:'Los usuarios de CAA a menudo necesitan más tiempo para encontrar sus palabras. ¿Cuánto espera usted de verdad? Descúbralo y practique la pausa.',vlab:'Voz',
 round:'Ronda {a} de {b}',p1:'Parte 1: Revísese',p2:'Parte 2: Practique la pausa',
 introh:'Así funciona',intro:'Le hará una pregunta a un estudiante. Luego haga lo que de verdad haría. Si repetiría la pregunta, daría una pista o la respuesta, o modelaría en el dispositivo, toque ese botón cuando lo haría. Si esperaría, solo espere. Algunos estudiantes contestan cuando tienen tiempo. Otros necesitan que usted modele primero.',
 introp2:'Ahora el círculo está activado. Cuente despacio en su mente, respire y deje que el círculo se llene hasta la zona verde. Primero espere. Si el estudiante todavía necesita ayuda, modele.',start:'¡Vamos!',ask:'Hacer la pregunta',next:'Siguiente ronda →',
 repeat:'Repetir la pregunta',tell:'Dar una pista o la respuesta',model:'Modelar en el dispositivo',waitnote:'O simplemente espere. Toque un botón solo cuando de verdad lo haría.',look:'{n} lo mira a usted.',you:'Usted:',
 mod:'Esperó {s} segundos y luego modeló “{m}.”',modp:'{n} observó y luego dijo “{w}.” Primero una pausa y luego un modelo: así se hace.',
 early:'Modeló a los {s} segundos.',earlyp:'Modelar es la herramienta correcta, pero {n} estaba por decir “{w}” por su cuenta. Primero espere. Modele cuando termine la pausa y todavía necesite ayuda.',
 earlyn:'Esta vez {n} sí necesitaba un modelo, y funcionó: dijo “{w}.” La próxima vez, dé una pausa completa primero para que tenga la oportunidad de contestar solo.',
 rep:'Repitió la pregunta a los {s} segundos.',repp:'{n} todavía estaba pensando en “{w}.” Oír la pregunta otra vez reinicia su pensamiento. Una espera tranquila ayuda más.',repn:'{n} escuchó la pregunta la primera vez. Lo que necesitaba era ver cómo decirlo. Espere y luego modele.',
 tel:'Dio la respuesta a los {s} segundos.',telp:'{n} estaba por decir “{w}.” Cuando contestamos por los estudiantes, aprenden que otra persona hablará por ellos.',teln:'Cuando contestamos por los estudiantes, aprenden que otra persona hablará por ellos. Después de una pausa, modele en el dispositivo y devuélvale el turno.',
 stall:'Esperó {s} segundos.',stallp:'¡Qué paciencia! Pero {n} lo miró buscando ayuda. Después de unos 10 segundos sin respuesta, modele unas palabras en el dispositivo y espere otra vez.',
 res:{wait:'contestó después de esperar',modeled:'esperó y luego modeló',early:'modeló muy pronto',repeat:'repitió la pregunta',tell:'dio la respuesta',stall:'esperó, sin modelo'},
 lg:{good:'La mejor opción',soft:'Casi',miss:'Le quitó el turno'},sum:'{g} de {n} rondas salieron como los estudiantes lo necesitan.',
 cues:['','Cuente en su mente…','Siga mirándolo…','Respire…','Ya casi…'],
 good:'¡Esperó {s} segundos y {n} contestó!',goodp:'Esa pausa le dio a {n} tiempo para encontrar las palabras.',
  endh:'Sus tiempos de espera',avg:'Su espera promedio: {s} segundos.',zone:'La franja verde es la zona de 5 a 10 segundos.',
 sumMid:'Está dando un buen tiempo de espera. El siguiente paso es lo que hace después de la pausa: modelar en el dispositivo en vez de repetir la pregunta o contestar por el estudiante.',sumHi:'Les dio tiempo a los estudiantes y, cuando necesitaron ayuda, modeló en vez de contestar por ellos. Ese es el hábito.',sumLo:'La mayoría intervenimos rápido. Estudios en salones han encontrado que los adultos esperan alrededor de un segundo. Con práctica, la pausa se hace más fácil.',
 why:'Por qué importa: encontrar una palabra en un dispositivo de CAA requiere planear y varios movimientos. Cuando intervenimos, los estudiantes aprenden que otra persona hablará por ellos. Una pausa tranquila les dice que su turno viene. Primero espere. Si todavía necesitan ayuda, modele en su dispositivo y espere otra vez.',
 table:'Ver como tabla',tr:'Ronda',ts:'Segundos de espera',tres:'Resultado',again:'Jugar otra vez',sec:'{s} s',
 foot:'Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const Q=[
{n:'Maya',en:'What do you want for snack?',es:'¿Qué quieres de merienda?',a:'f:food:cookie',s:5.6},
{n:'Leo',en:'Where should we go after lunch?',es:'¿A dónde vamos después del almuerzo?',a:'f:places:library',s:7.2},
{n:'Sofía',en:'How are you feeling today?',es:'¿Cómo te sientes hoy?',a:'f:feelings:tired',need:true,m:['i','feel','f:feelings:happy']},
{n:'Jayden',en:'Who do you want to sit with?',es:'¿Con quién te quieres sentar?',a:'f:people:friend',s:8.1},
{n:'Ana',en:'What should we do next?',es:'¿Qué hacemos ahora?',a:'play',s:6.1},
{n:'Marcus',en:'What did you do at recess?',es:'¿Qué hiciste en el recreo?',a:'f:actions:played',need:true,m:['i','f:actions:went','f:places:outside']}];
const MODEL_OK=7,LOOK=10,GIVE_UP=20,OUT={wait:'good',modeled:'good',early:'soft',stall:'soft',repeat:'miss',tell:'miss'},COL={good:'#4d7d0b',soft:'#f59f00',miss:'#bf490a'};
const t=k=>T[L][k],f1=x=>(Math.round(x*10)/10).toFixed(1);
const ring=()=>r>=3;
const R=84,C=2*Math.PI*R;
function stage(){const q=Q[r];const part=r<3?t('p1'):t('p2');
 const zoneArc=C*(5/10*0)+0;
 return `<div class="hud"><b>${t('round').replace('{a}',r+1).replace('{b}',Q.length)}</b><span class="part">${part}</span></div>
 <div class="stage"><p class="qq" id="qq">${state==='ready'?'&nbsp;':`“${esc(q[L])}”`}</p>
 <div class="who">${ring()?`<svg class="ring" viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="${R}"/><circle class="zone" cx="100" cy="100" r="${R}" stroke-dasharray="${C*.5} ${C}" stroke-dashoffset="${-C*.5}"/><circle class="fg" id="fg" cx="100" cy="100" r="${R}" stroke-dasharray="0 ${C}"/></svg>`:''}
 <div class="av"><img src="${sym('kid')}" alt=""></div><div class="think" id="think"><i></i><i></i><i></i></div></div>
 <p class="name">${esc(q.n)}</p><div class="ans" id="ans"></div><p class="cue" id="cue"></p><p class="secs" id="secs"></p>
 <div class="btns" id="btns">${state==='ready'?`<button class="btn ask" data-a="ask">${t('ask')}</button>`:state==='waiting'?`<button class="btn act" data-a="repeat">${t('repeat')}</button><button class="btn act" data-a="tell">${t('tell')}</button><button class="btn act" data-a="model">${t('model')}</button></div><p class="waitnote" id="wn">${t('waitnote')}</p><div>`:''}</div></div><div id="res"></div>`}
function show(){
 if(intro){$('game').innerHTML=`<div class="why" style="margin:0 0 14px"><h2>${t('introh')}</h2><p>${r>=3?t('introp2'):t('intro')}</p></div><div class="row" style="justify-content:center"><button class="btn ask" data-a="start" style="background:#4d7d0b;color:#fff">${t('start')}</button></div>`;return}
 if(r>=Q.length){results();return}
 $('game').innerHTML=stage();
}
function ask(){const q=Q[r];state='asking';show();
 const go=()=>{if(state!=='asking')return;state='waiting';show();$('think').classList.add('on');t0=performance.now();const due=q.need?Infinity:q.s+(Math.random()*1.2-.6);
  const tick=()=>{const s=(performance.now()-t0)/1000;if(ring()){const fg=$('fg');if(fg){fg.setAttribute('stroke-dasharray',`${Math.min(s/10,1)*C} ${C}`);fg.style.stroke=s>=5?'#28803a':'#94d82d'}$('secs').textContent=f1(s)+' s'}
   if(q.need&&s>=LOOK){$('think').classList.remove('on');$('cue').textContent=t('look').replace('{n}',q.n)}
   else $('cue').textContent=ring()?t('cues')[Math.min(4,Math.floor(s/1.6))]:'';
   if(s>=due){answer(due);return}if(q.need&&s>=GIVE_UP){act('stall');return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)};
 speak(q[L],L,go);clearTimeout(timer);timer=setTimeout(go,900+q[L].length*75)}
function answer(s){cancelAnimationFrame(raf);state='done';const q=Q[r],w=byId[q.a];waits[r]={s,kind:'wait'};
 $('think').classList.remove('on');$('btns').innerHTML='';$('cue').textContent='';const wn=$('wn');if(wn)wn.remove();$('ans').innerHTML=AAC.keyHtml(w,L);speak(w[L],L);
 $('res').innerHTML=`<div class="result good"><img src="${sym('party')}" alt=""><div><b>${t('good').replace('{s}',f1(s)).replace('{n}',esc(q.n))}</b><p>${t('goodp').replace('{n}',esc(q.n))}</p></div></div><div class="btns"><button class="btn go" data-a="next">${t('next')}</button></div>`;confetti($('ans'),40)}
function result(kind,b,p){const img=OUT[kind]==='good'?'party':OUT[kind]==='soft'?'bulb':'hourglass';
 $('res').innerHTML=`<div class="result ${OUT[kind]==='good'?'good':OUT[kind]==='soft'?'soft':'miss'}"><img src="${sym(img)}" alt=""><div><b>${b}</b><p>${p}</p></div></div><div class="btns"><button class="btn go" data-a="next">${t('next')}</button></div>`}
function act(how){const s=Math.min((performance.now()-t0)/1000,GIVE_UP);cancelAnimationFrame(raf);hush();state='done';const q=Q[r],w=byId[q.a],sf=f1(s);
 $('think').classList.remove('on');$('btns').innerHTML='';$('cue').textContent='';const wn=$('wn');if(wn)wn.remove();
 const fill=x=>x.replace('{s}',sf).replace('{n}',esc(q.n)).replace('{w}',esc(w[L]));
 let kind=how;
 if(how==='model'){const ms=q.m||[q.a],words=ms.map(id=>byId[id]).filter(Boolean),phrase=words.map(x=>x[L]).join(' ');
  kind=q.need&&s>=MODEL_OK?'modeled':'early';waits[r]={s,kind};
  $('ans').innerHTML=`<span class="lab">${t('you')}</span>`+words.map(x=>AAC.keyHtml(x,L,'tabindex="-1"').replace('class="k ','class="k mod ')).join('');
  const reply=()=>{if(state!=='done'||waits[r]!==rec)return;
   if(q.need){$('ans').innerHTML=AAC.keyHtml(w,L);speak(w[L],L);if(kind==='modeled')confetti($('ans'),40)}
   if(kind==='modeled')result(kind,t('mod').replace('{s}',sf).replace('{m}',esc(phrase)),fill(t('modp')));
   else result(kind,fill(t('early')),fill(q.need?t('earlyn'):t('earlyp')))};
  const rec=waits[r];clearTimeout(timer);let done=false;const once=()=>{if(done)return;done=true;timer=setTimeout(reply,700)};
  speak(phrase,L,once);timer=setTimeout(once,1200+phrase.length*80);return}
 waits[r]={s,kind};
 if(how==='repeat')result(kind,fill(t('rep')),fill(q.need?t('repn'):t('repp')));
 else if(how==='tell')result(kind,fill(t('tel')),fill(q.need?t('teln'):t('telp')));
 else result(kind,fill(t('stall')),fill(t('stallp')));
}
function results(){
 const avg=waits.reduce((a,b)=>a+b.s,0)/waits.length,W=640,H=280,pl=44,pb=34,pt=32,max=10,bw=(W-pl-20)/waits.length;
 const y=v=>pt+(H-pt-pb)*(1-Math.min(v,max)/max);
 const bars=waits.map((w,k)=>{const x=pl+k*bw+bw*.22,bwid=bw*.56,top=y(w.s);return `<g class="bar" data-k="${k}"><rect x="${pl+k*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/><path d="M${x},${H-pb} V${top+4} q0,-4 4,-4 h${bwid-8} q4,0 4,4 V${H-pb}Z" fill="${COL[OUT[w.kind]]}"/><text class="vl" x="${x+bwid/2}" y="${top-6}" text-anchor="middle">${f1(w.s)}</text><text x="${x+bwid/2}" y="${H-12}" text-anchor="middle">${k+1}</text></g>`}).join('');
 const grid=[0,5,10].map(v=>`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".12"/><text x="${pl-8}" y="${y(v)+5}" text-anchor="end">${v}s</text>`).join('');
 const g=waits.filter(w=>OUT[w.kind]==='good').length,hi=g>=4;
 $('game').innerHTML=`<h2>${t('endh')}</h2><p class="sum"><b>${t('sum').replace('{g}',g).replace('{n}',waits.length)}</b> ${t('avg').replace('{s}',f1(avg))} ${hi?t('sumHi'):avg>=5?t('sumMid'):t('sumLo')}</p>
 <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('endh')}"><rect x="${pl}" y="${y(10)}" width="${W-pl-10}" height="${y(5)-y(10)}" fill="#94d82d" opacity=".22"/>${grid}${bars}</svg></div>
 <div class="legend">${['good','soft','miss'].map(k=>`<span><i style="background:${COL[k]}"></i>${t('lg')[k]}</span>`).join('')}</div><p class="muted small">${t('zone')}</p>
 <details><summary>${t('table')}</summary><table><tr><th>${t('tr')}</th><th>${t('ts')}</th><th>${t('tres')}</th></tr>${waits.map((w,k)=>`<tr><td>${k+1}</td><td>${f1(w.s)}</td><td>${t('res')[w.kind]}</td></tr>`).join('')}</table></details>
