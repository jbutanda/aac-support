<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try an AAC Device</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* VOICE everyday, warm, for families, staff and admin at once
   IDEA a real robust AAC device: message bar, folder row, 60-word core grid
   PICTURE the working device itself, large, under the title band
   COLOUR violet band, charcoal housing, modified Fitzgerald key colours, orange folders
   TYPE Atkinson Hyperlegible
   LAYOUT laptop: device left, mode panel right; phone: panel, then the device scrolling sideways */
:root{--band:#5f3dc4;--maxw:1240px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.main{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.main{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
.msg{display:flex;gap:8px;margin-bottom:10px}
.say{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:62px;padding:8px 12px;border-radius:14px;background:#f7f7f2;color:#16181d;border:0;font:inherit;text-align:left;cursor:pointer}
.say .ph{color:#5f646e}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;font-weight:700;font-size:17px}
.ctl{width:60px;border-radius:14px;border:0;background:#2a2e37;color:#eceef2;cursor:pointer;display:grid;place-items:center}
.ctl svg{width:24px;height:24px}
.gw{overflow-x:auto}
.k.lit,.fk.lit{outline:5px solid #fff;outline-offset:-5px;box-shadow:0 0 0 4px #ffd43b;transform:scale(1.06)}
.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 20px 44px rgba(16,20,30,.16)}
.panel h2{font-size:22px;margin:0 0 8px}
.panel p{margin:0 0 12px}
.note{font-size:14px;color:var(--soft)}
.ccard{background:var(--tint);border-radius:14px;padding:16px;margin-bottom:12px}
.ccard .big{font-size:22px;font-weight:700;line-height:1.2}
.stars{display:flex;gap:4px;margin:10px 0 4px;flex-wrap:wrap}
.stars img{width:22px;height:22px;opacity:.25}
.stars img.on{opacity:1}
.ok{color:var(--go);font-weight:700;min-height:1.5em}
.phr{display:flex;flex-direction:column;gap:8px}
.phr button{font:inherit;font-weight:700;min-height:44px;text-align:left;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.phr button[aria-pressed=true]{border-color:var(--go);box-shadow:inset 4px 0 0 var(--go)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:14px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
@media(max-width:1099px){.panel{order:-1}}
</style>
</head>
<body>
<header class="band"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button><label class="vc"><span id="vlab">Voice</span><select id="voice"></select></label></div></div>
  <div class="tabs" role="group" aria-label="Mode"><button class="pill" data-m="free" id="t-free"></button><button class="pill" data-m="challenge" id="t-challenge"></button><button class="pill" data-m="model" id="t-model"></button></div>
</div></header>
<main class="wrap">
  <div class="main">
    <section class="card" aria-label="AAC device"><div class="device"><div class="msg"><button class="say" id="say"></button><button class="ctl" id="del" aria-label="Delete last word"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/></svg></button><button class="ctl" id="clr" aria-label="Clear message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div><div class="gw"><div id="dv"></div></div><p class="swipe" id="swipe"></p></div></section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script src="../shared/vocab.js"></script>
<script src="../shared/device.js"></script>
<script>
{
const {byId,sym,speak,hush,voiceSelect,langToggle,confetti,esc}=AAC;
const T={
 en:{h1:'Try an AAC Device',sub:'Tap a word and the AAC device says it. Open a folder for more words, or spell anything with ABC. This is how many of our students talk every day.',ph:'Tap words to build a message',tabs:['1. Free talk','2. Challenge','3. Watch me model'],
  free:['Free talk','Tap any word. Your words line up in the bar on top; tap the bar to hear the whole message.','The orange keys across the top are folders. Core words stay put on the home page, so students can find them by motor memory. Short messages are normal. Every message counts.'],
  ch:['Challenge','Build the message, then tap the bar to say it.','Skip','Nice! Next one...','Not quite. Try again or tap Skip.','You finished every challenge. That took real motor planning, which is what our students do all day.','Start over'],
  mo:['Watch me model','Pick a phrase. Watch the keys light up, including folder trips, while the AAC device speaks, the way an adult models on a student’s device.','Modeling means we touch the words while we talk. No quiz, no "now you say it." Students learn to talk on a device by seeing it used, the same way babies learn speech by hearing it.'],
  key:[['pro','people'],['verb','actions'],['desc','describing'],['q','questions'],['soc','social'],['neg','no'],['noun','things and places'],['det','little words']],
  foot:'Sample page. This board and its folders are our own demo arrangement, not any app’s layout. Speech uses this device’s built-in voices; pick the most natural one in the Voice menu. Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
 es:{h1:'Prueba un dispositivo de CAA',sub:'Toca una palabra y el dispositivo de CAA la dice. Abre una carpeta para más palabras o escribe lo que quieras con ABC. Así es como muchos de nuestros estudiantes hablan todos los días.',ph:'Toca palabras para hacer un mensaje',tabs:['1. Habla libre','2. Reto','3. Mira cómo modelo'],
  free:['Habla libre','Toca cualquier palabra. Tus palabras aparecen en la barra de arriba; toca la barra para escuchar el mensaje completo.','Las teclas anaranjadas de arriba son carpetas. Las palabras clave siempre están en el mismo lugar de la página de inicio, para encontrarlas con la memoria motora. Los mensajes cortos son normales. Cada mensaje cuenta.'],
  ch:['Reto','Haz el mensaje y luego toca la barra para decirlo.','Saltar','¡Muy bien! Sigue...','Casi. Intenta otra vez o toca Saltar.','Terminaste todos los retos. Eso requiere planificación motora, igual que lo que hacen nuestros estudiantes todo el día.','Empezar de nuevo'],
  mo:['Mira cómo modelo','Escoge una frase. Mira cómo se iluminan las teclas, incluso al abrir carpetas, mientras habla el dispositivo de CAA, como cuando un adulto modela en el dispositivo del estudiante.','Modelar significa tocar las palabras mientras hablamos. No es un examen ni pedimos "ahora dilo tú." Los estudiantes aprenden a hablar con un dispositivo al verlo usar, igual que los bebés aprenden a hablar al escuchar.'],
  key:[['pro','personas'],['verb','acciones'],['desc','descripciones'],['q','preguntas'],['soc','social'],['neg','no'],['noun','cosas y lugares'],['det','palabritas']],
  foot:'Página de muestra. Este tablero y sus carpetas son nuestra propia demostración, no el diseño de ninguna aplicación. La voz usa las voces del dispositivo; escoge la más natural en el menú Voz. Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const has=(a,p)=>a.some(id=>id===p||id.startsWith(p));
const CH=[
 {en:'Ask for more.',es:'Pide más.',t:a=>a.includes('more')},
 {en:'Tell someone to stop.',es:'Dile a alguien que pare.',t:a=>a.includes('stop')},
 {en:'Ask a question.',es:'Haz una pregunta.',t:a=>a.includes('what')||a.includes('where')||a.includes('who')||has(a,'f:questions:')},
 {en:'Tell us your favorite food. (Try the Food folder.)',es:'Dinos tu comida favorita. (Prueba la carpeta Comida.)',t:a=>has(a,'f:food:')},
 {en:'Say how you feel.',es:'Di cómo te sientes.',t:a=>a.includes('feel')||a.includes('happy')||a.includes('sad')||has(a,'f:feelings:')},
 {en:'Build a message with 4 words or more.',es:'Haz un mensaje con 4 palabras o más.',t:a=>a.length>=4},
 {en:'Tell us where you went. (Actions and Places folders.)',es:'Dinos a dónde fuiste. (Carpetas Acciones y Lugares.)',t:a=>has(a,'f:places:')},
 {en:'Agree or disagree with a friend. (Chat folder.)',es:'Dale la razón o no a un amigo. (Carpeta Charla.)',t:a=>has(a,'f:chat:')||a.includes('yes')||a.includes('no')},
 {en:'Spell your name with ABC.',es:'Escribe tu nombre con ABC.',t:a=>has(a,'t:')},
 {en:'Be polite: say please or thanks.',es:'Sé amable: di por favor o gracias.',t:a=>a.includes('please')||a.includes('thanks')}];
const PH=[
 {ids:['i','want','more'],en:'I want more.',es:'Yo quiero más.'},
 {ids:['i','like','f:food:pizza'],en:'I like pizza!',es:'¡Me gusta la pizza!'},
 {ids:['i','feel','f:feelings:tired'],en:'I feel tired.',es:'Me siento cansado.'},
 {ids:['i','f:actions:went','f:little:to','f:little:the','f:places:park'],en:'I went to the park.',es:'Fui al parque.'},
 {ids:['f:chat:me-too'],en:'Me too!',es:'¡Yo también!'},
 {ids:['f:questions:what-happened'],en:'What happened?',es:'¿Qué pasó?'},
 {ids:['look','big'],en:'Look, big!',es:'¡Mira, grande!'},
 {ids:['your','turn'],en:'Your turn.',es:'Tu turno.'},
 {ids:['stop','alldone'],en:'Stop. All done.',es:'Para. Terminé.'},
 {ids:['help','please'],en:'Help, please.',es:'Ayuda, por favor.'}];
const QL=()=>{try{const q=new URLSearchParams(location.search).get('lang');return q==='es'||q==='en'?q:''}catch(e){return ''}};const S={mode:'free',lang:QL()||'en',msg:[],ch:0,stars:0,fb:'',phr:-1,busy:false};
const $=id=>document.getElementById(id);
const lbl=w=>w[S.lang];
const dev=AAC.Device($('dv'),{lang:()=>S.lang,onPick:w=>{if(S.busy)return;S.msg.push(w.id);S.fb='';renderMsg();speak(lbl(w),S.lang)}});
const renderMsg=()=>{const t=T[S.lang];$('say').innerHTML=S.msg.length?S.msg.map(id=>{const w=byId[id];return `<span class="chip ${w.c}">${esc(lbl(w))}</span>`}).join(''):`<span class="ph">${t.ph}</span>`};
const legend=()=>`<div class="legend">${T[S.lang].key.map(([c,n])=>`<span><i class="${c}"></i>${n}</span>`).join('')}</div>`;
const renderPanel=()=>{const t=T[S.lang];let h='';
 if(S.mode==='free')h=`<h2>${t.free[0]}</h2><p>${t.free[1]}</p><p class="note">${t.free[2]}</p>`;
 else if(S.mode==='challenge'){const done=S.ch>=CH.length;h=`<h2>${t.ch[0]}</h2><div class="ccard">${done?`<div class="big">${t.ch[5]}</div>`:`<div class="big">${CH[S.ch][S.lang]}</div><p class="note" style="margin:6px 0 0">${t.ch[1]}</p>`}<div class="stars">${CH.map((_,i)=>`<img class="${i<S.stars?'on':''}" src="${sym('star')}" alt="">`).join('')}</div><div class="ok">${S.fb}</div></div>${done?`<button class="btn" id="restart">${t.ch[6]}</button>`:`<button class="btn ghost" id="skip">${t.ch[2]}</button>`}`}
 else h=`<h2>${t.mo[0]}</h2><p>${t.mo[1]}</p><div class="phr">${PH.map((p,i)=>`<button data-p="${i}" aria-pressed="${i===S.phr}">${p[S.lang]}</button>`).join('')}</div><p class="note" style="margin-top:12px">${t.mo[2]}</p>`;
 $('panel').innerHTML=h+legend()};
const chrome=()=>{const t=T[S.lang];document.documentElement.lang=S.lang;$('swipe').textContent=S.lang==='es'?'Desliza para ver todo el tablero, o gira el teléfono.':'Swipe to see the whole board, or turn your phone sideways.';$('h1').textContent=t.h1;$('sub').textContent=t.sub;$('foot').textContent=t.foot;$('vlab').textContent=S.lang==='es'?'Voz':'Voice';
 ['free','challenge','model'].forEach((m,i)=>{const b=$('t-'+m);b.textContent=t.tabs[i];b.setAttribute('aria-pressed',S.mode===m)})};
const all=()=>{chrome();dev.render();renderMsg();renderPanel()};
const setMode=m=>{S.mode=m;S.msg=[];S.fb='';S.phr=-1;hush();S.busy=false;dev.home();if(location.hash!=='#'+m)history.replaceState(null,'','#'+m);all()};
const flash=(el,ms)=>new Promise(r=>{if(!el){r();return}el.classList.add('lit');setTimeout(()=>{el.classList.remove('lit');r()},ms)});
const say=t=>new Promise(r=>speak(t,S.lang,r));
const model=async i=>{if(S.busy)return;S.busy=true;S.phr=i;S.msg=[];renderMsg();renderPanel();const p=PH[i];dev.home();
 for(const id of p.ids){if(S.mode!=='model')break;const f=dev.folderOf(id);
  if(f!=='core'&&dev.page!==f){await flash(document.querySelector(`#dv .fk[data-f="${f}"]`),500);dev.go(f)}
  else if(f==='core'&&dev.page!=='core'){await flash(document.querySelector('#dv .fk[data-f="core"]'),400);dev.home()}
  const el=dev.keyEl(id);if(el)el.classList.add('lit');S.msg.push(id);renderMsg();await say(lbl(byId[id]));await new Promise(r=>setTimeout(r,250));if(el)el.classList.remove('lit')}
 if(S.mode==='model'){dev.home();await say(p[S.lang])}S.busy=false};
$('say').addEventListener('click',()=>{if(!S.msg.length||S.busy)return;const txt=S.msg.map(id=>lbl(byId[id])).join(' ');
 if(S.mode==='challenge'&&S.ch<CH.length){const t=T[S.lang];if(CH[S.ch].t(S.msg)){speak(txt,S.lang);S.stars++;S.ch++;S.fb=t.ch[3];S.msg=[];renderMsg();renderPanel();confetti($('panel'),50);return}S.fb=t.ch[4];speak(txt,S.lang);renderPanel();return}
 speak(txt,S.lang)});
$('del').addEventListener('click',()=>{if(S.busy)return;S.msg.pop();renderMsg()});
$('clr').addEventListener('click',()=>{if(S.busy)return;S.msg=[];renderMsg()});
$('panel').addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p){model(+p.dataset.p);return}
 if(e.target.id==='skip'){S.ch++;S.fb='';S.msg=[];renderMsg();renderPanel()}
 if(e.target.id==='restart'){S.ch=0;S.stars=0;S.fb='';S.msg=[];renderMsg();renderPanel()}});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)});
langToggle($('langs'),()=>S.lang,l=>{S.lang=l;S.busy=false;fill();all()});
const fill=voiceSelect($('voice'),()=>S.lang);
const fromHash=()=>{const h=location.hash.slice(1);return['free','challenge','model'].includes(h)?h:'free'};
window.addEventListener('hashchange',()=>{const m=fromHash();if(m!==S.mode)setMode(m)});
$('deco').innerHTML=[['../talker/symbols/say.svg',10,12,62,-8],['../talker/symbols/more.svg',46,58,44,8],['../talker/symbols/like.svg',78,10,50,-6],['../talker/symbols/go.svg',28,60,40,10]].map(([n,x,y,z,r],i)=>`<img src="${n}" alt="" style="left:${x}%;top:${y}%;width:${z}px;transform:rotate(${r}deg);animation-delay:${-i}s">`).join('');
S.mode=fromHash();all();
}
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
<script src="../shared/keep-lang.js"></script>
</body>
</html>
