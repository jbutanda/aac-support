<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modeling Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* VOICE everyday, a clicker staff keep open on a phone or classroom iPad
   IDEA an activity ring: every model you do fills it toward today's goal
   PICTURE the big goal ring with the count in the middle and one giant button
   COLOUR teal band, green ring, Fitzgerald colours on the quick-word chips
   TYPE Atkinson Hyperlegible
   LAYOUT ring and button side by side on laptop, stacked on phone; week bars and top words below */
:root{--band:#0b7285;--maxw:900px}
.hero{display:grid;grid-template-columns:220px 1fr;gap:clamp(16px,4vw,40px);align-items:center}
.ring{position:relative;width:220px;height:220px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{display:block;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.ring span{font-size:14px;font-weight:700;color:var(--soft)}
.ring.hit svg{filter:drop-shadow(0 0 10px rgba(43,138,62,.55))}
.tap{font:inherit;font-weight:700;font-size:clamp(24px,4vw,32px);width:100%;min-height:110px;border-radius:24px;border:0;background:var(--go);color:#fff;cursor:pointer;box-shadow:0 8px 0 #1e6b38;transition:transform .07s,box-shadow .07s}
.tap:active{transform:translateY(6px);box-shadow:0 2px 0 #1e6b38}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.quick button{font:inherit;font-weight:700;font-size:15px;min-height:42px;padding:4px 12px 4px 6px;border-radius:999px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.quick img{width:28px;height:28px}
.subrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.goal{display:flex;align-items:center;gap:8px;font-weight:700}
.goal input{width:80px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:180px;margin-top:8px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:color-mix(in srgb,var(--go) 40%,var(--line));min-height:4px}
.bar.met i{background:var(--go)}
.bar.today i{outline:3px solid var(--ink);outline-offset:2px}
.bar b{font-size:14px;font-variant-numeric:tabular-nums}
.bar span{font-size:13px;color:var(--soft);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stats div{background:var(--tint);border-radius:16px;padding:12px;text-align:center}
.stats b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;font-weight:700;color:var(--soft)}
.top5{display:grid;gap:8px;margin-top:10px}
.top5 div{display:grid;grid-template-columns:34px 90px 1fr 34px;gap:8px;align-items:center}
.top5 img{width:30px}
.top5 i{display:block;height:14px;border-radius:7px;background:var(--go)}
.top5 b{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:620px){.hero{grid-template-columns:1fr;justify-items:center}.ring{width:190px;height:190px}.tap{min-height:96px}}
</style>
</head>
<body>
<header class="band"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button></div></div>
</div></header>
<main class="wrap">
  <section class="card"><div class="hero"><div class="ring" id="ring"></div><div><button class="tap" id="tap"></button><div class="quick" id="quick"></div><div class="subrow"><label class="goal"><span id="gl"></span><input class="in" type="number" min="1" max="200" id="goal"></label><div class="row"><button class="btn ghost" id="undo"></button></div></div></div></div></section>
  <section class="card"><h2 id="wk"></h2><div class="bars" id="bars"></div><div class="stats" id="stats"></div></section>
  <section class="card"><h2 id="tw"></h2><div class="top5" id="top5"></div><div class="row" style="margin-top:16px"><a class="btn go" id="send" target="_blank" rel="noopener" hidden></a><button class="btn ghost" id="copy"></button><span class="muted small" id="copied"></span></div></section>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script>
{
const {byId,store,confetti,langToggle,sym,esc}=AAC;
/* AACademy PrAACtice log. In the AACademy Check-In form: three dots > Get pre-filled link.
   Pick "PrAACtice: today's log", answer "Yes", and type WORDS (all capitals) in "Words you modeled".
   Click Get link, copy it, and paste it between the quotes below. The button stays hidden until then. */
const CHECKIN_LOG_URL='';
const QUICK=['more','go','stop','help','look','want','like','alldone','i','you','what','turn'];
const T={
 en:{h1:'Modeling Tracker',sub:'Tap every time you model a word on a student’s device. Watch the ring fill toward today’s goal.',tap:'I modeled!',goal:'Daily goal',undo:'Undo',today:'today',of:(g)=>`of ${g}`,wk:'This week',tw:'Top words today',none:'Tap a word chip when you model it to see your top words here.',
  st:['Today','Days goal met (7)','Day streak'],copy:'Copy my data',send:'Send today’s AACademy log',copied:'Copied. Paste it into a spreadsheet.',days:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],hit:'Goal reached!',
  foot:'Counts are saved only in this browser, on this device. Nothing is sent anywhere. Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0.'},
 es:{h1:'Registro de modelado',sub:'Toque cada vez que modele una palabra en el aparato de un estudiante. Vea cómo el anillo se llena hacia la meta del día.',tap:'¡Modelé!',goal:'Meta diaria',undo:'Deshacer',today:'hoy',of:(g)=>`de ${g}`,wk:'Esta semana',tw:'Palabras más usadas hoy',none:'Toque una palabra cuando la modele para ver aquí sus palabras más usadas.',
  st:['Hoy','Días con meta (7)','Racha de días'],copy:'Copiar mis datos',send:'Enviar el registro de AACademy de hoy',copied:'Copiado. Péguelo en una hoja de cálculo.',days:['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],hit:'¡Meta cumplida!',
  foot:'Los conteos se guardan solo en este navegador, en este dispositivo. No se envía nada. Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0.'}};
const $=id=>document.getElementById(id);
const QL=()=>{try{const q=new URLSearchParams(location.search).get('lang');return q==='es'||q==='en'?q:''}catch(e){return ''}};const S={lang:QL()||store.get('mt-lang','en'),log:store.get('mt-log',{}),goal:store.get('mt-goal',20),hist:[]};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const day=k=>S.log[k]||(S.log[k]={n:0,w:{}});
const todayK=()=>iso(new Date());
const save=()=>store.set('mt-log',S.log);
const last7=()=>{const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({k:iso(d),d})}return out};
const streak=()=>{const met=i=>{const d=new Date();d.setDate(d.getDate()-i);return ((S.log[iso(d)]||{}).n||0)>=S.goal};let n=0,i=met(0)?0:1;while(i<366&&met(i)){n++;i++}return n};
const add=w=>{const t=day(todayK());const was=t.n;t.n++;if(w)t.w[w]=(t.w[w]||0)+1;S.hist.push(w||null);save();render();if(was<S.goal&&t.n>=S.goal)confetti($('ring'),100)};
const render=()=>{const t=T[S.lang],k=todayK(),n=(S.log[k]||{}).n||0,g=S.goal,C=2*Math.PI*84,f=Math.min(1,n/g);
 document.documentElement.lang=S.lang;$('h1').textContent=t.h1;$('sub').textContent=t.sub;$('foot').textContent=t.foot;$('tap').textContent=t.tap;$('gl').textContent=t.goal;$('undo').textContent=t.undo;$('wk').textContent=t.wk;$('tw').textContent=t.tw;$('copy').textContent=t.copy;{const sb=$('send'),dw=(S.log[k]||{}).w||{},ws=Object.entries(dw).sort((a,b)=>b[1]-a[1]).map(([id])=>byId[id]?byId[id][S.lang]:id).slice(0,6).join(', ');sb.textContent=t.send;sb.hidden=!CHECKIN_LOG_URL;if(CHECKIN_LOG_URL)sb.href=CHECKIN_LOG_URL.replace('WORDS',encodeURIComponent(ws))}$('goal').value=g;
 $('ring').className='ring'+(n>=g?' hit':'');
 $('ring').innerHTML=`<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="var(--tint)" stroke-width="22"/><circle cx="100" cy="100" r="84" fill="none" stroke="var(--go)" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" style="transition:stroke-dashoffset .35s"/></svg><div class="ctr"><div><b>${n}</b><span>${n>=g?t.hit:t.of(g)}</span></div></div>`;
 $('quick').innerHTML=QUICK.map(id=>{const w=byId[id];return `<button class="${w.c}" data-w="${id}"><img src="${w.img}" alt="">${esc(w[S.lang])}</button>`}).join('');
 const L=last7(),mx=Math.max(g,...L.map(x=>(S.log[x.k]||{}).n||0));
 $('bars').innerHTML=L.map((x,i)=>{const v=(S.log[x.k]||{}).n||0;return `<div class="bar${v>=g?' met':''}${i===6?' today':''}"><b>${v}</b><i style="height:${Math.max(3,v/mx*100)}%"></i><span>${t.days[x.d.getDay()]}</span></div>`}).join('');
 const met=L.filter(x=>((S.log[x.k]||{}).n||0)>=g).length;
 $('stats').innerHTML=[[n,t.st[0]],[met,t.st[1]],[streak(),t.st[2]]].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
 const w=Object.entries((S.log[k]||{}).w||{}).sort((a,b)=>b[1]-a[1]).slice(0,5),wm=w.length?w[0][1]:1;
 $('top5').innerHTML=w.length?w.map(([id,v])=>{const x=byId[id];return `<div><img src="${x.img}" alt=""><span>${esc(x[S.lang])}</span><i style="width:${v/wm*100}%"></i><b>${v}</b></div>`}).join(''):`<p class="muted">${t.none}</p>`};
$('tap').addEventListener('click',()=>add(null));
$('quick').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b)add(b.dataset.w)});
$('undo').addEventListener('click',()=>{const t=S.log[todayK()];if(!t||!t.n)return;t.n--;const w=S.hist.pop();if(w&&t.w[w]){t.w[w]--;if(!t.w[w])delete t.w[w]}save();render()});
$('goal').addEventListener('change',e=>{const v=Math.max(1,Math.min(200,parseInt(e.target.value)||20));S.goal=v;store.set('mt-goal',v);render()});
$('copy').addEventListener('click',async()=>{const rows=[['date','models','words']].concat(Object.keys(S.log).sort().map(k=>[k,S.log[k].n,Object.entries(S.log[k].w).map(([a,b])=>a+':'+b).join(' ')]));const txt=rows.map(r=>r.join('\t')).join('\n');try{await navigator.clipboard.writeText(txt);$('copied').textContent=T[S.lang].copied}catch(e){$('copied').textContent=''}});
langToggle($('langs'),()=>S.lang,l=>{S.lang=l;store.set('mt-lang',l);render()});
$('deco').innerHTML=[['target',12,12,60,-8],['chart',48,56,56,8],['fire',80,14,50,-6],['star',30,62,40,10]].map(([n,x,y,z,r],i)=>`<img src="${sym(n)}" alt="" style="left:${x}%;top:${y}%;width:${z}px;transform:rotate(${r}deg);animation-delay:${-i}s">`).join('');
render();
}
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
<script src="../shared/keep-lang.js"></script>
</body>
</html>
