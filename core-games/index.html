<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Word Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* IDEA projector games that only move when someone SAYS the word. Kids say it on their own device, an adult or student taps the big key
   LAYOUT game tabs, a 16:9 stage, a row of six giant core keys; full screen for the smartboard */
:root{--band:#f59f00;--bandink:#2b1d00;--bandsoft:rgba(43,29,0,.78);--maxw:1200px;--decol:72%}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{font:inherit;font-weight:700;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:8px 18px 8px 8px;background:var(--tint);color:var(--ink);cursor:pointer;min-height:52px;font-size:17px}
.tab img{width:38px;background:#fff;border-radius:50%;padding:4px}
.tab[aria-pressed=true]{background:#f59f00;color:#2b1d00}
.arena{background:#1d2026;border-radius:26px;padding:12px}
.arena:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;padding:2vw}
.arena:fullscreen .stage{aspect-ratio:auto;flex:1}
.stage{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#d0ebff}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.said{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;color:#16181d;border-radius:999px;padding:6px 20px;font-weight:700;font-size:clamp(18px,3vw,34px);box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none}
.said.on{opacity:1;animation:pop .35s cubic-bezier(.2,1.8,.4,1)}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:12px}
.keys .k{aspect-ratio:auto;min-height:clamp(84px,11vw,140px);border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.keys .k img{width:52%;max-width:72px}
.keys .k .w{font-size:clamp(16px,2vw,26px)}
.keys .k:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.how{margin:0;max-width:70ch}
.fs{background:#f59f00;color:#2b1d00}
@media(max-width:640px){.keys{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="band has-hero"><div class="deco" id="deco" aria-hidden="true"></div><div class="bandin">
  <div class="top"><div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
  <div class="ctrls" id="langs"><button class="pill" data-l="en">English</button><button class="pill" data-l="es">Español</button><label class="vc"><span id="vlab">Voice</span><select id="voice"></select></label></div></div>

  <img class="hero" id="hero" src="../shared/art/core-word-games.jpg" alt="Students on a classroom rug cheer at bubbles on the whiteboard while a classmate holds up his communication tablet." data-en="Students on a classroom rug cheer at bubbles on the whiteboard while a classmate holds up his communication tablet." data-es="Estudiantes en la alfombra celebran las burbujas en la pizarra mientras un compañero levanta su tableta de comunicación." width="960" height="540">
</div></header>
<main class="wrap">
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="arena" id="arena"><div class="stage" id="stage"></div><div class="keys" id="keys"></div></div>
    <div class="bar"><p class="how muted" id="how"></p><button class="btn fs" id="fs"></button></div>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script src="../shared/core.js"></script>
<script>
const {esc,sym,byId,speak,confetti}=AAC,$=id=>document.getElementById(id);
let L=AAC.pageLang(),G=AAC.store.get('cg-game','bubbles'),game=null;
const T={en:{h1:'Core Word Games',sub:'Put these on the smartboard. They only move when someone says the word. Students say it on their own device, then they or an adult tap the big key.',vlab:'Voice',fs:'Full screen',exit:'Exit full screen',
 g:{bubbles:'Bubbles',car:'Race Car',monster:'Silly Monster'},
 how:{bubbles:'Say MORE for bubbles. GO and STOP to float or freeze. BIG and LITTLE change the next ones. ALL DONE pops them all. You can pop bubbles by tapping too.',car:'GO and STOP drive the car. TURN flips it around. UP makes it jump. DIFFERENT paints it a new color. Reach the flag, then AGAIN to race again.',monster:'Make a silly monster. MORE adds eyes, DIFFERENT changes the color, BIG and LITTLE change the size, HAPPY and SAD change the face.'},
 foot:'Symbols: OpenMoji (openmoji.org), CC BY-SA 4.0. Model on the student’s own device whenever you can.'},
es:{h1:'Juegos de palabras clave',sub:'Póngalos en la pizarra. Solo se mueven cuando alguien dice la palabra. Los estudiantes la dicen en su propio dispositivo y luego ellos o un adulto tocan la tecla grande.',vlab:'Voz',fs:'Pantalla completa',exit:'Salir de pantalla completa',
 g:{bubbles:'Burbujas',car:'Carro de carreras',monster:'Monstruo chistoso'},
 how:{bubbles:'Digan MÁS para burbujas. IR y PARA para que floten o se congelen. GRANDE y PEQUEÑO cambian las siguientes. TERMINÉ las revienta todas. También pueden tocar las burbujas para reventarlas.',car:'IR y PARA mueven el carro. TURNO lo voltea. ARRIBA lo hace saltar. DIFERENTE lo pinta de otro color. Lleguen a la bandera y digan OTRA VEZ para correr de nuevo.',monster:'Hagan un monstruo chistoso. MÁS agrega ojos, DIFERENTE cambia el color, GRANDE y PEQUEÑO cambian el tamaño, FELIZ y TRISTE cambian la cara.'},
 foot:'Símbolos: OpenMoji (openmoji.org), CC BY-SA 4.0. Modele en el dispositivo del estudiante siempre que pueda.'}};
const GAMES={bubbles:{ic:'bubbles',keys:['more','go','stop','big','little','alldone']},car:{ic:'racecar',keys:['go','stop','turn','up','different','again']},monster:{ic:'monster',keys:['more','different','big','little','happy','sad']}};
const t=k=>T[L][k];
const COLORS=['#ff6b6b','#4dabf7','#69db7c','#ffd43b','#da77f2','#ff922b','#3bc9db'];
let said=0;
function flash(w){let s=$('stage').querySelector('.said');if(!s){s=document.createElement('div');s.className='said';$('stage').appendChild(s)}s.textContent=w;s.classList.remove('on');void s.offsetWidth;s.classList.add('on');clearTimeout(said);said=setTimeout(()=>s.classList.remove('on'),1400)}
/* ---------- Bubbles ---------- */
function Bubbles(st){const c=document.createElement('canvas');st.appendChild(c);const x=c.getContext('2d');let W,H,bs=[],moving=true,size=1,pops=[],raf;
 const fit=()=>{const r=st.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)};fit();addEventListener('resize',fit);
 const add=n=>{for(let i=0;i<n;i++){const r=(14+Math.random()*24)*size*(W/900);bs.push({x:W*(.15+Math.random()*.7),y:H+r+Math.random()*80,r,vx:(Math.random()-.5)*.6,vy:-(0.6+Math.random()*1.1),h:Math.random()*360,w:Math.random()*6})}};
 const pop=(b)=>{for(let i=0;i<10;i++){const a=Math.random()*6.28;pops.push({x:b.x,y:b.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,l:1,h:b.h})}};
 const draw=()=>{x.clearRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a5d8ff');g.addColorStop(1,'#e7f5ff');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='#8ce99a';x.beginPath();x.ellipse(W*.5,H*1.05,W*.75,H*.18,0,0,7);x.fill();
  for(const b of bs){if(moving){b.w+=.03;b.x+=b.vx+Math.sin(b.w)*.4;b.y+=b.vy}
   const rg=x.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);rg.addColorStop(0,'rgba(255,255,255,.9)');rg.addColorStop(.6,`hsla(${b.h},90%,75%,.25)`);rg.addColorStop(1,`hsla(${(b.h+60)%360},90%,60%,.55)`);
   x.fillStyle=rg;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.strokeStyle=`hsla(${b.h},80%,60%,.6)`;x.lineWidth=2;x.stroke()}
  bs=bs.filter(b=>b.y>-b.r*2);
  for(const p of pops){p.x+=p.vx;p.y+=p.vy;p.l-=.04;x.fillStyle=`hsla(${p.h},90%,60%,${Math.max(0,p.l)})`;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}pops=pops.filter(p=>p.l>0);
  raf=requestAnimationFrame(draw)};
 c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;const i=bs.findIndex(b=>(b.x-px)**2+(b.y-py)**2<b.r*b.r);if(i>=0){pop(bs[i]);bs.splice(i,1)}});
 add(8);draw();
 return {act(w){if(w==='more'){add(10);moving=true}if(w==='go')moving=true;if(w==='stop')moving=false;if(w==='big')size=2;if(w==='little')size=.5;if(w==='alldone'){bs.forEach(pop);bs=[]}if(w==='big'||w==='little')add(6)},stop(){cancelAnimationFrame(raf);removeEventListener('resize',fit)}}}
/* ---------- Race car ---------- */
function Car(st){st.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74c0fc"/><stop offset="1" stop-color="#d0ebff"/></linearGradient></defs>
 <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1380" cy="140" r="70" fill="#ffd43b"/><g fill="#fff" opacity=".9"><ellipse cx="300" cy="150" rx="110" ry="36"/><ellipse cx="370" cy="130" rx="70" ry="34"/><ellipse cx="900" cy="210" rx="90" ry="28"/></g>
 <path d="M0,560 C300,470 500,520 800,500 S1300,450 1600,520 V900 H0Z" fill="#8ce99a"/><rect y="600" width="1600" height="200" fill="#495057"/><rect y="690" width="1600" height="10" fill="#fff" opacity=".0"/>
 <g id="dash">${Array.from({length:20},(_,i)=>`<rect x="${i*100}" y="695" width="56" height="10" rx="5" fill="#fff"/>`).join('')}</g>
 <g transform="translate(1420,470)"><rect x="0" y="0" width="12" height="230" fill="#343a40"/>${[0,1,2,3].map(r=>[0,1,2,3,4].map(c=>`<rect x="${12+c*26}" y="${r*26}" width="26" height="26" fill="${(r+c)%2?'#fff':'#212529'}"/>`).join('')).join('')}</g>
 <g id="car"><g id="carbody"><ellipse cx="0" cy="62" rx="120" ry="14" fill="rgba(0,0,0,.25)"/><path id="paint" d="M-120,30 C-120,0 -100,-10 -60,-12 L-30,-55 C-20,-68 50,-68 64,-55 L95,-12 C120,-10 130,5 130,30 L130,40 L-120,40Z" fill="#ff6b6b" stroke="#212529" stroke-width="6"/><path d="M-22,-46 L-48,-12 L10,-12 L10,-50Z M22,-50 L22,-12 L80,-12 L56,-46Z" fill="#d0ebff" stroke="#212529" stroke-width="5"/>
 <g id="w1" transform="translate(-70,42)"><circle r="30" fill="#212529"/><circle r="13" fill="#adb5bd"/><rect x="-3" y="-13" width="6" height="26" fill="#495057"/></g><g id="w2" transform="translate(80,42)"><circle r="30" fill="#212529"/><circle r="13" fill="#adb5bd"/><rect x="-3" y="-13" width="6" height="26" fill="#495057"/></g></g></g></svg>`);
 let px=180,dir=1,v=0,go=false,jy=0,jv=0,rot=0,col=0,raf,won=false;const car=st.querySelector('#car'),paint=st.querySelector('#paint'),w1=st.querySelector('#w1'),w2=st.querySelector('#w2');
 const loop=()=>{v+=((go?5:0)-v)*.06;px+=v*dir;if(px>1440){px=1440;if(!won){won=true;go=false;confetti(st,90)}}if(px<140)px=140;
  if(jy<0||jv){jv+=1.4;jy+=jv;if(jy>=0){jy=0;jv=0}}rot+=v*dir*2.4;
  car.setAttribute('transform',`translate(${px},${640+jy}) scale(${dir},1)`);[w1,w2].forEach((w,i)=>w.setAttribute('transform',`translate(${i?80:-70},42) rotate(${rot*dir})`));raf=requestAnimationFrame(loop)};loop();
 return {act(w){if(w==='go'){go=true;if(won&&px>=1440)dir=-1}if(w==='stop')go=false;if(w==='turn')dir*=-1;if(w==='up'&&jy===0)jv=-26;if(w==='different'){col=(col+1)%COLORS.length;paint.setAttribute('fill',COLORS[col])}if(w==='again'){px=180;dir=1;v=0;go=false;won=false}},stop(){cancelAnimationFrame(raf)}}}
/* ---------- Silly monster ---------- */
function Monster(st){let eyes=1,col=4,sz=1,mood='happy',t0=performance.now(),raf;st.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f3f0ff"/><g fill="#e5dbff">${Array.from({length:14},(_,i)=>`<circle cx="${(i*137)%1600}" cy="${(i*271)%900}" r="${30+(i*13)%50}"/>`).join('')}</g><ellipse cx="800" cy="820" rx="360" ry="40" fill="rgba(0,0,0,.12)"/><g id="mon"></g></svg>`);
 const g=st.querySelector('#mon');
 const draw=()=>{const s=sz,c=COLORS[col],ex=[];const n=eyes;for(let i=0;i<n;i++){const ang=n===1?0:(-0.9+1.8*i/(n-1));const r=n<=3?0:40;ex.push([Math.sin(ang)*(n===1?0:150)+(i%2?0:0),-120-Math.cos(ang)*r-(i%2&&n>3?60:0)])}
  g.innerHTML=`<g transform="translate(800,520) scale(${s})"><g id="bob"><path d="M-260,260 C-300,40 -230,-240 0,-250 C230,-240 300,40 260,260 C200,230 160,290 120,250 C80,290 40,230 0,265 C-40,230 -80,290 -120,250 C-160,290 -200,230 -260,260Z" fill="${c}" stroke="#212529" stroke-width="10"/>
  <path d="M-170,-210 L-210,-330 L-110,-235Z M170,-210 L210,-330 L110,-235Z" fill="${c}" stroke="#212529" stroke-width="10" stroke-linejoin="round"/>
  ${ex.map(([x,y])=>`<g transform="translate(${x},${y})"><circle r="56" fill="#fff" stroke="#212529" stroke-width="8"/><circle class="pupil" cx="0" cy="8" r="24" fill="#212529"/><circle cx="-8" cy="-2" r="7" fill="#fff"/></g>`).join('')}
  ${mood==='happy'?'<path d="M-120,40 Q0,170 120,40 Z" fill="#212529"/><path d="M-60,70 h40 v-26 h-40Z M20,70 h40 v-26 h-40Z" fill="#fff"/><ellipse cx="0" cy="110" rx="46" ry="20" fill="#ff8787"/>':'<path d="M-110,120 Q0,20 110,120" fill="none" stroke="#212529" stroke-width="16" stroke-linecap="round"/><path d="M-150,-40 q-10,40 6,70" stroke="#4dabf7" stroke-width="16" fill="none" stroke-linecap="round"/>'}
  <path d="M-260,60 C-360,20 -370,-60 -330,-90" fill="none" stroke="${c}" stroke-width="44" stroke-linecap="round"/><path d="M260,60 C360,${mood==='happy'?'-20 380,-120 330,-170':'90 370,150 330,190'}" fill="none" stroke="${c}" stroke-width="44" stroke-linecap="round"/></g></g>`};
 const loop=n=>{const b=st.querySelector('#bob');if(b){const k=(n-t0)/1000;b.setAttribute('transform',`translate(0,${Math.sin(k*2)*10}) rotate(${Math.sin(k*1.3)*2})`)}raf=requestAnimationFrame(loop)};draw();raf=requestAnimationFrame(loop);
 return {act(w){if(w==='more')eyes=eyes>=7?1:eyes+1;if(w==='different')col=(col+1)%COLORS.length;if(w==='big')sz=Math.min(1.25,sz+.2);if(w==='little')sz=Math.max(.45,sz-.2);if(w==='happy')mood='happy';if(w==='sad')mood='sad';draw()},stop(){cancelAnimationFrame(raf)}}}
const MAKE={bubbles:Bubbles,car:Car,monster:Monster};
function load(){if(game)game.stop();const st=$('stage');st.innerHTML='';game=MAKE[G](st);
 $('keys').innerHTML=GAMES[G].keys.map(id=>AAC.keyHtml(byId[id],L)).join('');$('how').textContent=t('how')[G]}
function render(){$('h1').textContent=t('h1');$('sub').textContent=t('sub');$('vlab').textContent=t('vlab');$('foot').textContent=t('foot');document.title=t('h1');$('fs').textContent=document.fullscreenElement?t('exit'):t('fs');
 $('tabs').innerHTML=Object.keys(GAMES).map(k=>`<button class="tab" data-g="${k}" aria-pressed="${k===G}"><img src="${sym(GAMES[k].ic)}" alt="">${t('g')[k]}</button>`).join('');
 $('keys').innerHTML=GAMES[G].keys.map(id=>AAC.keyHtml(byId[id],L)).join('');$('how').textContent=t('how')[G];if(!game)load()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-g]');if(g){G=g.dataset.g;AAC.store.set('cg-game',G);render();load();return}
 const k=e.target.closest('#keys .k');if(k){const w=byId[k.dataset.id];speak(w[L],L);flash(w[L]);game&&game.act(w.id)}});
$('fs').onclick=()=>{const a=$('arena');try{document.fullscreenElement?document.exitFullscreen():a.requestFullscreen()}catch(e){}};
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?t('exit'):t('fs');if(G==='bubbles')load()});
AAC.deco($('deco'),[['bubbles',8,10,62,-6],['racecar',46,56,52,4],['monster',80,12,56,8],['balloon',30,60,44,-6]]);
(function(){const h=document.getElementById('hero');const sync=()=>{if(h)h.alt=h.dataset[document.documentElement.lang==='es'?'es':'en']};new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});sync()})();
AAC.page(()=>L,l=>L=l,render);
</script>
<script src="../shared/catalog.js"></script><script src="../shared/bookmark.js"></script>
</body>
</html>
